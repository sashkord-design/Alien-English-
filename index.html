<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Alien Memory Scanner</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --ink-dark: #18181b;
            --wrong-text: #7e22ce;
            --correct-text: #15803d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #145359;
            color: var(--ink-dark);
            overflow: hidden;
        }

        .retro-board {
            width: 100vw;
            height: 100dvh;
            background-color: #145359;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px 14px 16px;
            position: relative;
            overflow: hidden;
        }

        /* Background layers */
        .bg-layer {
            position: absolute;
            width: 108vw;
            height: 108dvh;
            top: -4dvh;
            left: -4vw;
            z-index: 0;
            pointer-events: none;
            transition: opacity 0.45s ease, filter 0.45s ease;
        }

        .bg-first-page {
            background-image: url('background%20first%20page.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 1;
        }

        .bg-clouds-page {
            background-image: url('Background1.webp');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: saturate(0.8) brightness(1.02);
            opacity: 0;
        }

        .bg-vault-page {
            background-image: url('Background2.webp');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
        }

        .retro-board.clouds-bg .bg-first-page,
        .retro-board.clouds-bg .bg-vault-page {
            opacity: 0;
        }

        .retro-board.clouds-bg .bg-clouds-page {
            opacity: 1;
        }

        .retro-board.vault-bg .bg-first-page,
        .retro-board.vault-bg .bg-clouds-page {
            opacity: 0;
        }

        .retro-board.vault-bg .bg-vault-page {
            opacity: 1;
        }

        .retro-board.blurred-bg .bg-layer {
            filter: blur(5px) brightness(0.86);
        }

        .content-wrap {
            width: 100%;
            max-width: 360px;
            height: 100%;
            z-index: 2;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Horizontal page slide transitions */
        .page-slide {
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            bottom: 0;
            margin: auto;
            width: 100%;
            opacity: 1;
            transition: transform 0.72s cubic-bezier(0.16, 1, 0.3, 1), filter 0.45s ease;
            will-change: transform, filter;
        }

        .page-slide.enter-from-right {
            transform: translateX(120vw);
        }

        .page-slide.exit-to-left {
            transform: translateX(-120vw);
            pointer-events: none;
        }

        .page-slide.active-center {
            transform: translateX(0);
        }

        /* 1. INTRO SCREEN */
        .intro-screen {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding-top: 2px;
            padding-bottom: 6px;
        }

        .intro-illustration {
            width: 100%;
            max-width: 100%;
            max-height: 49dvh;
            height: auto;
            object-fit: contain;
            object-position: top center;
            border: 2px solid var(--ink-dark);
            border-radius: 14px;
            box-shadow: 2px 3px 0px var(--ink-dark);
            user-select: none;
            -webkit-user-drag: none;
            flex-shrink: 1;
        }

        .intro-bottom-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 10px;
            flex-shrink: 0;
        }

        .narrative-box {
            width: 100%;
            background-image: url('frame.png');
            background-size: cover;
            background-position: center;
            border: 2px solid var(--ink-dark);
            border-radius: 14px;
            overflow: hidden;
            padding: 11px 14px;
            margin-bottom: 12px;
            box-shadow: 2px 3px 0px var(--ink-dark);
        }

        .narrative-text {
            font-size: 11.5px;
            line-height: 1.38;
            color: var(--ink-dark);
            font-weight: 500;
            text-align: justify;
            text-align-last: left;
        }

        .intro-arrows-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
        }

        .arrow-yellow-btn {
            position: relative;
            background-color: #fcd34d;
            background-image: url('frame.png');
            background-size: cover;
            background-position: center;
            border: 2px solid var(--ink-dark);
            border-radius: 11px;
            overflow: hidden;
            color: var(--ink-dark);
            width: 44px;
            height: 36px;
            font-size: 15px;
            font-weight: 900;
            line-height: 1;
            cursor: pointer;
            box-shadow: 2px 2px 0px var(--ink-dark);
            transition: transform 0.16s ease, box-shadow 0.16s ease;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .arrow-yellow-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background-color: rgba(252, 211, 77, 0.78);
            pointer-events: none;
            z-index: 0;
        }

        .arrow-yellow-btn span {
            position: relative;
            z-index: 1;
        }

        .arrow-yellow-btn:active,
        .arrow-yellow-btn.pressed {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px var(--ink-dark);
        }

        .btn-action::before {
            content: '';
            position: absolute;
            inset: 0;
            background-color: rgba(252, 211, 77, 0.72);
            pointer-events: none;
            z-index: 0;
        }

        .btn-action.saved-state::before {
            background-color: rgba(134, 239, 172, 0.78);
        }

        .btn-action span {
            position: relative;
            z-index: 1;
        }

        /* 2. SCAN WORKSPACE */
        .scan-workspace {
            width: 100%;
            height: fit-content;
            display: none;
            flex-direction: column;
            align-items: center;
        }

        .riddle-box {
            width: 100%;
            background-image: url('frame.png');
            background-size: cover;
            background-position: center;
            border: 2px solid var(--ink-dark);
            border-radius: 14px;
            overflow: hidden;
            padding: 12px 16px;
            text-align: center;
            margin-bottom: 12px;
            box-shadow: 2px 3px 0px var(--ink-dark);
        }

        .riddle-text {
            font-size: 14px;
            line-height: 1.35;
            font-weight: 700;
            color: var(--ink-dark);
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 100%;
            margin-bottom: 14px;
            opacity: 1;
        }

        .card-slot {
            perspective: 800px;
            height: 88px;
        }

        .mini-cube-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            -webkit-transform-style: preserve-3d;
            animation: mini-levitate 4s ease-in-out infinite;
            cursor: pointer;
        }

        @keyframes mini-levitate {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-3px); }
        }

        .mini-cube {
            width: 100%;
            height: 100%;
            position: absolute;
            transform-style: preserve-3d;
            -webkit-transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .card-slot.flipped .mini-cube {
            transform: rotateY(180deg);
        }

        .mini-face {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            background-image: url('frame.png');
            background-size: cover;
            background-position: center;
            border: 2px solid var(--ink-dark);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 10px;
            text-align: center;
            box-shadow: 2px 3px 0px var(--ink-dark);
        }

        .mini-face-back {
            transform: rotateY(180deg);
        }

        .card-emoji { font-size: 22px; margin-bottom: 2px; }
        .card-title { font-size: 12px; font-weight: 700; color: var(--ink-dark); }

        .card-slot.wrong .mini-face-back span {
            color: var(--wrong-text);
            font-weight: 800;
            font-size: 10.5px;
            line-height: 1.25;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .card-slot:not(.wrong) .mini-face-back span {
            font-size: 11px;
            line-height: 1.3;
            font-weight: 600;
            color: var(--ink-dark);
            text-align: center;
        }

        .card-slot.correct .mini-face-back div {
            color: var(--correct-text);
        }

        .action-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 100%;
            opacity: 1;
            transform: translateX(-120vw);
            pointer-events: none;
            transition: transform 0.65s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: transform;
        }

        .action-row.visible {
            transform: translateX(0);
            pointer-events: auto;
        }

        .btn-action {
            position: relative;
            background-image: url('frame.png');
            background-size: cover;
            background-position: center;
            border: 2px solid var(--ink-dark);
            border-radius: 14px;
            overflow: hidden;
            color: var(--ink-dark);
            padding: 12px 10px;
            font-size: 11.5px;
            font-weight: 800;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            cursor: pointer;
            width: 100%;
            box-shadow: 2px 3px 0px var(--ink-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .btn-action:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px var(--ink-dark);
        }

        /* 3. MEMORY STORAGE CENTERED 2x2 WITH HORIZONTAL SCROLL */
        .memory-vault {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.72s cubic-bezier(0.16, 1, 0.3, 1), filter 0.45s ease;
        }

        .memory-vault.defocused {
            filter: blur(5px) brightness(0.84);
            pointer-events: none;
        }

        .vault-scroll {
            position: relative;
            width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .vault-scroll.has-overflow {
            justify-content: flex-start;
        }

        .vault-scroll::-webkit-scrollbar {
            display: none;
        }

        .vault-grid {
            display: grid;
            grid-template-rows: repeat(2, 122px);
            grid-auto-flow: column;
            grid-auto-columns: 122px;
            row-gap: 10px;
            column-gap: 12px;
            width: max-content;
            align-items: center;
            justify-items: center;
            padding: 4px;
        }

        .vault-node-slot {
            width: 122px;
            height: 122px;
            cursor: pointer;
            animation: node-levitate 4.4s ease-in-out infinite;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .vault-node-slot.picked-out {
            visibility: hidden;
            pointer-events: none;
        }

        @keyframes node-levitate {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-4px); }
        }

        .vault-mini-canvas {
            width: 122px;
            height: 122px;
            display: block;
        }

        /* Shared pink action button placed cleanly in flow below cubes */
        .bottom-nav-btn {
            position: relative;
            margin-top: 26px;
            background-color: #d9779a;
            background-image: url('frame.png');
            background-size: cover;
            background-position: center;
            border: 2px solid var(--ink-dark);
            border-radius: 12px;
            overflow: hidden;
            color: var(--ink-dark);
            padding: 10px 20px;
            font-size: 11.5px;
            font-weight: 800;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 2px 2px 0px var(--ink-dark);
            z-index: 30;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .bottom-nav-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background-color: rgba(236, 122, 162, 0.72);
            pointer-events: none;
            z-index: 0;
        }

        .bottom-nav-btn span {
            position: relative;
            z-index: 1;
        }

        .bottom-nav-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px var(--ink-dark);
        }

        /* 4. THREE.JS WEBGL 3D CUBE STAGE (CENTERED FULL VIEWPORT OVERLAY) */
        .cube-stage {
            display: none;
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100dvh;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
            z-index: 40;
            padding: 16px;
        }

        .webgl-cube-holder {
            position: relative;
            width: 264px;
            height: 264px;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: scale(0.88);
            transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .webgl-cube-holder.approached {
            transform: scale(1);
        }

        #threeCanvasHost {
            width: 264px;
            height: 264px;
            position: relative;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #threeCanvasHost canvas {
            display: block;
            width: 264px !important;
            height: 264px !important;
        }

        .touch-overlay {
            position: absolute;
            inset: 8px;
            z-index: 20;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
        }

        .zone {
            cursor: pointer;
            background: transparent;
            border: none;
        }
    </style>
</head>
<body>

    <div class="retro-board" id="retroBoard">
        <!-- Background Layers -->
        <div class="bg-layer bg-first-page"></div>
        <div class="bg-layer bg-clouds-page"></div>
        <div class="bg-layer bg-vault-page"></div>

        <div class="content-wrap">

            <!-- Screen 1: Intro Narrative -->
            <div class="intro-screen page-slide active-center" id="introScreen">
                <img src="Alan%20and%20the%20apple.jpg" alt="Alan in the orchard" class="intro-illustration">

                <div class="intro-bottom-group">
                    <div class="narrative-box">
                        <p class="narrative-text">
                            Alan wandered into an orchard and saw various fruits lying on the ground. While looking around, something suddenly fell on his head. It was red and firm. And it was...
                        </p>
                    </div>

                    <div class="intro-arrows-row">
                        <button class="arrow-yellow-btn" id="prevArrowBtn" onclick="pulseArrow(this)" aria-label="Previous"><span>←</span></button>
                        <button class="arrow-yellow-btn" id="nextArrowBtn" onclick="startScan(this)" aria-label="Next"><span>→</span></button>
                    </div>
                </div>
            </div>

            <!-- Screen 2: Hand-Drawn Mini-Cube Quiz Choices -->
            <div class="scan-workspace page-slide" id="scanWorkspace">
                <div class="riddle-box">
                    <div class="riddle-text">The fruit that fell on Alan’s head</div>
                </div>

                <div class="cards-grid" id="cardsGrid">
                    <!-- Card 0: Plum -->
                    <div class="card-slot" id="card0" data-correct="false">
                        <div class="mini-cube-wrapper" onclick="handleCardTap(this.parentElement)">
                            <div class="mini-cube">
                                <div class="mini-face">
                                    <div class="card-emoji">🍑</div>
                                    <div class="card-title">Plum</div>
                                </div>
                                <div class="mini-face mini-face-back">
                                    <span>Scan error</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Card 1: Orange -->
                    <div class="card-slot" id="card1" data-correct="false">
                        <div class="mini-cube-wrapper" onclick="handleCardTap(this.parentElement)">
                            <div class="mini-cube">
                                <div class="mini-face">
                                    <div class="card-emoji">🍊</div>
                                    <div class="card-title">Orange</div>
                                </div>
                                <div class="mini-face mini-face-back">
                                    <span>Scan error</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Card 2: Pear -->
                    <div class="card-slot" id="card2" data-correct="false">
                        <div class="mini-cube-wrapper" onclick="handleCardTap(this.parentElement)">
                            <div class="mini-cube">
                                <div class="mini-face">
                                    <div class="card-emoji">🍐</div>
                                    <div class="card-title">Pear</div>
                                </div>
                                <div class="mini-face mini-face-back">
                                    <span>Scan error</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Card 3: Apple -->
                    <div class="card-slot" id="card3" data-correct="true">
                        <div class="mini-cube-wrapper" onclick="handleCardTap(this.parentElement)">
                            <div class="mini-cube">
                                <div class="mini-face">
                                    <div class="card-emoji">🍎</div>
                                    <div class="card-title">Apple</div>
                                </div>
                                <div class="mini-face mini-face-back">
                                    <div style="font-weight: 800; font-size: 13px; letter-spacing: 0.05em;">APPLE</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="action-row" id="actionRow">
                    <button class="btn-action" id="saveCubeBtn" onclick="saveInCube()"><span>Save in Cube</span></button>
                    <button class="btn-action" id="goCubeBtn" onclick="openMemoryVault()"><span>Go to Cube</span></button>
                </div>
            </div>

            <!-- Screen 3: Memory Storage Centered 2x2 with Horizontal Scroll -->
            <div class="memory-vault page-slide" id="memoryVault">
                <div class="vault-scroll" id="vaultScroll">
                    <div class="vault-grid" id="vaultGrid"></div>
                </div>
                <button class="bottom-nav-btn" id="backToAdventuresBtn" onclick="returnToAdventures()"><span>Back to Adventures</span></button>
            </div>

        </div>

        <!-- Screen 4: Three.js WebGL 3D Cube Inspection (Centered Overlay) -->
        <div class="cube-stage" id="cubeStage">
            <div class="webgl-cube-holder" id="cubeDepthHolder">
                <div id="threeCanvasHost"></div>
                <div class="touch-overlay">
                    <div class="zone" onclick="tiltUp()"></div>
                    <div class="zone" onclick="tiltUp()"></div>
                    <div class="zone" onclick="tiltUp()"></div>

                    <div class="zone" onclick="turnLeft()"></div>
                    <div class="zone" onclick="turnBack()"></div>
                    <div class="zone" onclick="turnRight()"></div>

                    <div class="zone" onclick="tiltDown()"></div>
                    <div class="zone" onclick="tiltDown()"></div>
                    <div class="zone" onclick="tiltDown()"></div>
                </div>
            </div>

            <button class="bottom-nav-btn" id="backToGridBtn" onclick="returnToVault()"><span>← Back to Grid</span></button>
        </div>
    </div>

    <script>
        let isSolved = false;
        let isAppleSaved = false;
        let vaultSpinRaf = null;
        let activePickedSlot = null;
        let vaultMiniCubes = [];

        // Main Three.js inspection cube state
        let scene, camera, renderer, stoneCubeMesh;
        let targetRotX = 0;
        let targetRotY = 0;
        let currentRotX = 0;
        let currentRotY = 0;
        let threeAnimId = null;

        const CUBE_OFFSETS = [
            { x: -1, y: 1 },  { x: 1, y: -1 },
            { x: 1, y: 1 },   { x: -1, y: -1 }
        ];

        const DEFAULT_WORDS = [
            {
                id: 'orchard',
                word: 'ORCHARD',
                phonetic: '/ˈɔː.tʃəd/',
                definition: 'A piece of land planted with fruit trees',
                ex1: 'Alan walked slowly into an old orchard.',
                ex2: 'The apple trees in the orchard were full of fruit.',
                ex3: 'Autumn is the best season to visit an orchard.',
                visual: '🌳'
            },
            {
                id: 'firm',
                word: 'FIRM',
                phonetic: '/fɜːm/',
                definition: 'Hard and solid when pressed, not soft',
                ex1: 'The red fruit felt smooth and firm.',
                ex2: 'She picked a firm apple from the basket.',
                ex3: 'This mattress is comfortable and firm.',
                visual: '🧱'
            },
            {
                id: 'ground',
                word: 'GROUND',
                phonetic: '/ɡraʊnd/',
                definition: 'The solid surface of the earth',
                ex1: 'Various fruits were lying on the ground.',
                ex2: 'The ripe apple fell softly onto the ground.',
                ex3: 'Leaves covered the wet ground after rain.',
                visual: '🌱'
            },
            {
                id: 'head',
                word: 'HEAD',
                phonetic: '/hed/',
                definition: 'The upper part of the human body',
                ex1: 'Something suddenly fell right on Alan’s head.',
                ex2: 'He rubbed the top of his head in surprise.',
                ex3: 'A clever idea popped into his head.',
                visual: '👽'
            }
        ];

        const APPLE_WORD = {
            id: 'apple',
            word: 'APPLE',
            phonetic: '/ˈæp.əl/',
            definition: 'The fruit that fell on Alan’s head',
            ex1: 'I eat a fresh apple every morning.',
            ex2: 'She cut the apple into four equal pieces.',
            ex3: 'This green apple tastes quite sour.',
            visual: '🍎'
        };

        function getStoredWords() {
            try {
                const raw = localStorage.getItem('alien_memory_cubes_v13');
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed) && parsed.length > 0) return parsed;
                }
            } catch (e) {}
            return [...DEFAULT_WORDS];
        }

        function saveStoredWords(words) {
            try {
                localStorage.setItem('alien_memory_cubes_v13', JSON.stringify(words));
            } catch (e) {}
        }

        function slideBetweenPages(fromEl, toEl, onAfterShow) {
            fromEl.classList.remove('active-center');
            fromEl.classList.add('exit-to-left');

            toEl.style.display = 'flex';
            toEl.classList.remove('exit-to-left', 'active-center');
            toEl.classList.add('enter-from-right');
            toEl.offsetHeight;

            requestAnimationFrame(() => {
                toEl.classList.remove('enter-from-right');
                toEl.classList.add('active-center');
            });

            if (typeof onAfterShow === 'function') {
                onAfterShow();
            }

            setTimeout(() => {
                fromEl.style.display = 'none';
                fromEl.classList.remove('exit-to-left');
            }, 720);
        }

        function pulseArrow(btn) {
            if (!btn) return;
            btn.classList.add('pressed');
            setTimeout(() => btn.classList.remove('pressed'), 160);
        }

        function startScan(btn) {
            const intro = document.getElementById('introScreen');
            const workspace = document.getElementById('scanWorkspace');
            const board = document.getElementById('retroBoard');

            if (btn) btn.classList.add('pressed');

            setTimeout(() => {
                if (btn) btn.classList.remove('pressed');
                board.classList.remove('vault-bg');
                board.classList.add('clouds-bg');
                slideBetweenPages(intro, workspace);
            }, 160);
        }

        function handleCardTap(slot) {
            if (isSolved) return;

            const slotEl = slot.closest('.card-slot');
            const isCorrect = slotEl.dataset.correct === 'true';

            if (isCorrect) {
                isSolved = true;
                slotEl.classList.add('correct', 'flipped');

                const otherExamples = [
                    "I eat a fresh apple every morning.",
                    "She cut the apple into four equal pieces.",
                    "This green apple tastes quite sour."
                ];

                let exIdx = 0;
                document.querySelectorAll('.card-slot').forEach((otherSlot) => {
                    if (otherSlot !== slotEl) {
                        otherSlot.classList.remove('wrong');
                        otherSlot.querySelector('.mini-face-back span').textContent = otherExamples[exIdx++];
                        otherSlot.classList.add('flipped');
                    }
                });

                const actionRow = document.getElementById('actionRow');
                actionRow.classList.remove('visible');
                actionRow.offsetHeight;
                requestAnimationFrame(() => {
                    actionRow.classList.add('visible');
                });
            } else {
                const willFlip = !slotEl.classList.contains('flipped');
                slotEl.classList.toggle('flipped', willFlip);
                slotEl.classList.toggle('wrong', willFlip);
            }
        }

        function saveInCube() {
            if (isAppleSaved) return;
            isAppleSaved = true;

            const words = getStoredWords();
            if (!words.some(w => w.id === 'apple')) {
                words.unshift(APPLE_WORD);
                saveStoredWords(words);
            }

            const btn = document.getElementById('saveCubeBtn');
            btn.classList.add('saved-state');
            btn.querySelector('span').textContent = 'Saved ✓';
        }

        function openMemoryVault() {
            const workspace = document.getElementById('scanWorkspace');
            const vault = document.getElementById('memoryVault');
            const board = document.getElementById('retroBoard');

            const words = getStoredWords();
            if (!words.some(w => w.id === 'apple')) {
                words.unshift(APPLE_WORD);
                saveStoredWords(words);
            }

            renderVaultGrid(words);
            board.classList.remove('clouds-bg', 'blurred-bg');
            board.classList.add('vault-bg');
            vault.classList.remove('defocused');

            slideBetweenPages(workspace, vault, () => {
                startVaultSpinning();
            });
        }

        function returnToAdventures() {
            const vault = document.getElementById('memoryVault');
            const workspace = document.getElementById('scanWorkspace');
            const board = document.getElementById('retroBoard');

            if (vaultSpinRaf) {
                cancelAnimationFrame(vaultSpinRaf);
                vaultSpinRaf = null;
            }

            board.classList.remove('vault-bg', 'blurred-bg');
            board.classList.add('clouds-bg');

            vault.classList.remove('active-center');
            vault.classList.add('exit-to-left');

            workspace.style.display = 'flex';
            workspace.classList.remove('exit-to-left', 'active-center');
            workspace.classList.add('enter-from-right');
            workspace.offsetHeight;

            requestAnimationFrame(() => {
                workspace.classList.remove('enter-from-right');
                workspace.classList.add('active-center');
            });

            setTimeout(() => {
                vault.style.display = 'none';
                vault.classList.remove('exit-to-left');
            }, 720);
        }

        function createSharperStoneCubeGeometry(size, rounding = 0.11) {
            const segs = 12;
            const geom = new THREE.BoxGeometry(size, size, size, segs, segs, segs);
            const pos = geom.attributes.position;
            const half = size * 0.5;
            const r = Math.min(half * 0.9, size * rounding);
            const inner = Math.max(0.001, half - r);

            for (let i = 0; i < pos.count; i++) {
                let x = pos.getX(i);
                let y = pos.getY(i);
                let z = pos.getZ(i);

                const cx = Math.max(-inner, Math.min(inner, x));
                const cy = Math.max(-inner, Math.min(inner, y));
                const cz = Math.max(-inner, Math.min(inner, z));

                const dx = x - cx;
                const dy = y - cy;
                const dz = z - cz;
                const len = Math.hypot(dx, dy, dz);

                if (len > 0.00001) {
                    const targetLen = Math.min(r, len * 1.12);
                    x = cx + (dx / len) * targetLen;
                    y = cy + (dy / len) * targetLen;
                    z = cz + (dz / len) * targetLen;
                }

                pos.setXYZ(i, x, y, z);
            }

            geom.computeVertexNormals();
            return geom;
        }

        function seededRand(seed) {
            const x = Math.sin(seed * 12.9898 + 78.233) * 43758.5453;
            return x - Math.floor(x);
        }

        function createMultiStoneTextures(lines, options = {}, seedOffset = 1) {
            const size = 512;
            const colorCanvas = document.createElement('canvas');
            colorCanvas.width = size;
            colorCanvas.height = size;
            const ctx = colorCanvas.getContext('2d');

            const bumpCanvas = document.createElement('canvas');
            bumpCanvas.width = size;
            bumpCanvas.height = size;
            const bctx = bumpCanvas.getContext('2d');

            ctx.fillStyle = '#9ea3ac';
            ctx.fillRect(0, 0, size, size);

            bctx.fillStyle = '#808080';
            bctx.fillRect(0, 0, size, size);

            const greyPatches = [
                'rgba(138, 143, 152, 0.45)',
                'rgba(118, 123, 132, 0.42)',
                'rgba(154, 158, 166, 0.36)',
                'rgba(108, 113, 124, 0.35)',
                'rgba(122, 124, 148, 0.14)',
                'rgba(132, 122, 148, 0.13)'
            ];

            for (let i = 0; i < 12; i++) {
                const s = seedOffset * 100 + i * 17;
                const cx = seededRand(s + 1) * size;
                const cy = seededRand(s + 2) * size;
                const rx = 24 + seededRand(s + 3) * 60;
                const ry = 20 + seededRand(s + 4) * 50;
                const verts = 5 + Math.floor(seededRand(s + 5) * 3);
                const rot = seededRand(s + 6) * Math.PI * 2;
                const col = greyPatches[i % greyPatches.length];

                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(rot);
                ctx.beginPath();
                for (let v = 0; v < verts; v++) {
                    const ang = (v / verts) * Math.PI * 2;
                    const radScale = 0.7 + seededRand(s + 10 + v) * 0.45;
                    const px = Math.cos(ang) * rx * radScale;
                    const py = Math.sin(ang) * ry * radScale;
                    if (v === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.fillStyle = col;
                ctx.fill();
                ctx.restore();

                bctx.save();
                bctx.translate(cx, cy);
                bctx.rotate(rot);
                bctx.beginPath();
                for (let v = 0; v < verts; v++) {
                    const ang = (v / verts) * Math.PI * 2;
                    const radScale = 0.7 + seededRand(s + 10 + v) * 0.45;
                    const px = Math.cos(ang) * rx * radScale;
                    const py = Math.sin(ang) * ry * radScale;
                    if (v === 0) bctx.moveTo(px, py);
                    else bctx.lineTo(px, py);
                }
                bctx.closePath();
                bctx.fillStyle = i % 2 === 0 ? 'rgba(156, 156, 156, 0.34)' : 'rgba(102, 102, 102, 0.34)';
                bctx.fill();
                bctx.restore();
            }

            const sheen = ctx.createLinearGradient(0, 0, size, size);
            sheen.addColorStop(0, 'rgba(99, 102, 241, 0.08)');
            sheen.addColorStop(0.55, 'rgba(139, 92, 246, 0.06)');
            sheen.addColorStop(1, 'rgba(59, 130, 246, 0.04)');
            ctx.fillStyle = sheen;
            ctx.fillRect(0, 0, size, size);

            for (let c = 0; c < 14; c++) {
                const sc = seedOffset * 300 + c * 29;
                let x = 24 + seededRand(sc + 1) * (size - 48);
                let y = 24 + seededRand(sc + 2) * (size - 48);
                let ang = seededRand(sc + 3) * Math.PI * 2;
                const steps = 4 + Math.floor(seededRand(sc + 4) * 4);

                ctx.strokeStyle = 'rgba(24, 24, 27, 0.25)';
                ctx.lineWidth = 1.2 + seededRand(sc + 5) * 1.1;
                ctx.beginPath();
                ctx.moveTo(x, y);

                bctx.strokeStyle = 'rgba(35, 35, 35, 0.75)';
                bctx.lineWidth = 1.8;
                bctx.beginPath();
                bctx.moveTo(x, y);

                for (let st = 0; st < steps; st++) {
                    ang += (seededRand(sc + 10 + st) - 0.5) * 0.9;
                    const segLen = 8 + seededRand(sc + 20 + st) * 14;
                    x += Math.cos(ang) * segLen;
                    y += Math.sin(ang) * segLen;
                    ctx.lineTo(x, y);
                    bctx.lineTo(x, y);
                }
                ctx.stroke();
                bctx.stroke();
            }

            for (let p = 0; p < 44; p++) {
                const sp = seedOffset * 500 + p * 31;
                const px = 14 + seededRand(sp + 1) * (size - 28);
                const py = 14 + seededRand(sp + 2) * (size - 28);
                const pr = 1.2 + seededRand(sp + 3) * 3.4;

                ctx.fillStyle = p % 4 === 0 ? 'rgba(226, 232, 240, 0.22)' : 'rgba(24, 24, 27, 0.24)';
                ctx.beginPath();
                ctx.arc(px, py, pr, 0, Math.PI * 2);
                ctx.fill();

                bctx.fillStyle = p % 4 === 0 ? 'rgba(205, 205, 205, 0.55)' : 'rgba(45, 45, 45, 0.65)';
                bctx.beginPath();
                bctx.arc(px, py, pr + 0.8, 0, Math.PI * 2);
                bctx.fill();
            }

            for (let g = 0; g < 750; g++) {
                const gs = seedOffset * 900 + g * 13;
                const gx = seededRand(gs + 1) * size;
                const gy = seededRand(gs + 2) * size;
                const isLight = seededRand(gs + 3) > 0.5;
                ctx.fillStyle = isLight ? 'rgba(255, 255, 255, 0.08)' : 'rgba(24, 24, 27, 0.07)';
                ctx.fillRect(gx, gy, 2, 2);

                bctx.fillStyle = isLight ? 'rgba(185, 185, 185, 0.30)' : 'rgba(70, 70, 70, 0.30)';
                bctx.fillRect(gx, gy, 2, 2);
            }

            ctx.fillStyle = '#18181b';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            if (options.isEmoji) {
                ctx.font = '136px sans-serif';
                ctx.fillText(lines[0], size / 2, size / 2 + 4);
            } else if (options.isMiniWord) {
                const word = lines[0];
                const fontSize = word.length > 6 ? 54 : 66;
                ctx.font = `900 ${fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
                ctx.fillText(word, size / 2, size / 2 + 2);
            } else if (options.isTitle) {
                ctx.font = '900 70px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
                ctx.fillText(lines[0], size / 2, size / 2 - 20);
                if (lines[1]) {
                    ctx.font = '600 32px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
                    ctx.fillStyle = '#27272a';
                    ctx.fillText(lines[1], size / 2, size / 2 + 42);
                }
            } else {
                const fontSize = options.fontSize || 36;
                ctx.font = `700 ${fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
                const text = lines.join(' ');
                const words = text.split(' ');
                const wrapped = [];
                let currentLine = '';

                words.forEach((w) => {
                    const testLine = currentLine ? currentLine + ' ' + w : w;
                    if (ctx.measureText(testLine).width > size - 88 && currentLine) {
                        wrapped.push(currentLine);
                        currentLine = w;
                    } else {
                        currentLine = testLine;
                    }
                });
                if (currentLine) wrapped.push(currentLine);

                const lineHeight = fontSize * 1.3;
                const startY = size / 2 - ((wrapped.length - 1) * lineHeight) / 2;
                wrapped.forEach((line, idx) => {
                    ctx.fillText(line, size / 2, startY + idx * lineHeight);
                });
            }

            const map = new THREE.CanvasTexture(colorCanvas);
            map.anisotropy = 4;

            const bumpMap = new THREE.CanvasTexture(bumpCanvas);
            bumpMap.anisotropy = 4;

            return { map, bumpMap };
        }

        function disposeVaultMiniCubes() {
            vaultMiniCubes.forEach((entry) => {
                if (entry.renderer) {
                    entry.renderer.dispose();
                }
            });
            vaultMiniCubes = [];
        }

        function renderVaultGrid(words) {
            const grid = document.getElementById('vaultGrid');
            const scrollEl = document.getElementById('vaultScroll');
            disposeVaultMiniCubes();
            grid.innerHTML = '';

            const visibleWords = words.slice(0, 4);

            visibleWords.forEach((item, index) => {
                const offset = CUBE_OFFSETS[index % CUBE_OFFSETS.length];
                const slot = document.createElement('div');
                slot.className = 'vault-node-slot';
                slot.style.marginLeft = offset.x + 'px';
                slot.style.marginTop = offset.y + 'px';
                slot.style.animationDelay = ((index * 0.45) % 3.2) + 's';

                const canvas = document.createElement('canvas');
                canvas.className = 'vault-mini-canvas';
                canvas.width = 244;
                canvas.height = 244;
                slot.appendChild(canvas);

                slot.onclick = () => inspectMemoryCube(item, slot);
                grid.appendChild(slot);

                if (typeof THREE !== 'undefined') {
                    const miniScene = new THREE.Scene();
                    const miniCam = new THREE.PerspectiveCamera(36, 1, 0.1, 50);
                    miniCam.position.set(0, 0, 5.15);
                    miniCam.lookAt(0, 0, 0);

                    const miniRenderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
                    miniRenderer.setSize(122, 122);
                    miniRenderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

                    miniScene.add(new THREE.AmbientLight(0xd4d8e8, 0.85));
                    const dLight = new THREE.DirectionalLight(0xe4e4e7, 0.65);
                    dLight.position.set(2, 2.5, 4);
                    miniScene.add(dLight);

                    const geom = createSharperStoneCubeGeometry(2.02, 0.11);
                    const stoneSet = createMultiStoneTextures([item.word], { isMiniWord: true }, index + 1);
                    const mats = Array.from({ length: 6 }, () => new THREE.MeshStandardMaterial({
                        map: stoneSet.map,
                        bumpMap: stoneSet.bumpMap,
                        bumpScale: 0.035,
                        roughness: 0.84,
                        metalness: 0.05
                    }));

                    const mesh = new THREE.Mesh(geom, mats);
                    mesh.rotation.x = 0;
                    mesh.rotation.y = THREE.MathUtils.degToRad(index * 25);
                    miniScene.add(mesh);

                    miniRenderer.render(miniScene, miniCam);

                    vaultMiniCubes.push({
                        scene: miniScene,
                        camera: miniCam,
                        renderer: miniRenderer,
                        mesh,
                        angle: index * 25
                    });
                }
            });

            scrollEl.classList.toggle('has-overflow', grid.scrollWidth > scrollEl.clientWidth);
        }

        function startVaultSpinning() {
            if (vaultSpinRaf) cancelAnimationFrame(vaultSpinRaf);
            let lastTime = performance.now();

            function step(now) {
                const delta = now - lastTime;
                lastTime = now;

                vaultMiniCubes.forEach((entry) => {
                    entry.angle = (entry.angle + delta * 0.0105) % 360;
                    entry.mesh.rotation.x = 0;
                    entry.mesh.rotation.y = THREE.MathUtils.degToRad(entry.angle);
                    entry.renderer.render(entry.scene, entry.camera);
                });

                vaultSpinRaf = requestAnimationFrame(step);
            }

            vaultSpinRaf = requestAnimationFrame(step);
        }

        function initThreeCube(wordData) {
            const host = document.getElementById('threeCanvasHost');
            if (!host || typeof THREE === 'undefined') return;

            if (!renderer) {
                scene = new THREE.Scene();
                camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
                camera.position.set(0, 0, 5.5);
                camera.lookAt(0, 0, 0);

                renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setSize(264, 264);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
                host.innerHTML = '';
                host.appendChild(renderer.domElement);

                const ambient = new THREE.AmbientLight(0xd4d8e8, 0.85);
                scene.add(ambient);

                const keyLight = new THREE.DirectionalLight(0xe4e4e7, 0.65);
                keyLight.position.set(2, 2.5, 4);
                scene.add(keyLight);

                const rimLight = new THREE.DirectionalLight(0x818cf8, 0.2);
                rimLight.position.set(-2.5, -1.5, -2);
                scene.add(rimLight);
            }

            if (stoneCubeMesh) {
                scene.remove(stoneCubeMesh);
            }

            const geom = createSharperStoneCubeGeometry(2.04, 0.10);

            const faceSets = [
                createMultiStoneTextures([wordData.ex1], { fontSize: 36 }, 11),
                createMultiStoneTextures([wordData.ex2], { fontSize: 36 }, 12),
                createMultiStoneTextures([wordData.definition], { fontSize: 36 }, 13),
                createMultiStoneTextures([wordData.visual], { isEmoji: true }, 14),
                createMultiStoneTextures([wordData.word, wordData.phonetic], { isTitle: true }, 15),
                createMultiStoneTextures([wordData.ex3], { fontSize: 36 }, 16)
            ];

            const materials = faceSets.map((set) => new THREE.MeshStandardMaterial({
                map: set.map,
                bumpMap: set.bumpMap,
                bumpScale: 0.035,
                roughness: 0.84,
                metalness: 0.05
            }));

            stoneCubeMesh = new THREE.Mesh(geom, materials);
            scene.add(stoneCubeMesh);

            targetRotX = 0;
            targetRotY = 0;
            currentRotX = 0;
            currentRotY = 0;
            stoneCubeMesh.rotation.set(0, 0, 0);

            if (!threeAnimId) {
                renderThreeLoop();
            }
        }

        function renderThreeLoop() {
            threeAnimId = requestAnimationFrame(renderThreeLoop);
            if (!renderer || !scene || !camera) return;

            currentRotX += (targetRotX - currentRotX) * 0.14;
            currentRotY += (targetRotY - currentRotY) * 0.14;

            if (stoneCubeMesh) {
                stoneCubeMesh.rotation.x = THREE.MathUtils.degToRad(currentRotX);
                stoneCubeMesh.rotation.y = THREE.MathUtils.degToRad(currentRotY);
                stoneCubeMesh.position.y = Math.sin(performance.now() * 0.0022) * 0.035;
            }

            renderer.render(scene, camera);
        }

        function inspectMemoryCube(wordData, sourceSlot) {
            const vault = document.getElementById('memoryVault');
            const cubeStage = document.getElementById('cubeStage');
            const holder = document.getElementById('cubeDepthHolder');
            const board = document.getElementById('retroBoard');

            if (activePickedSlot) {
                activePickedSlot.classList.remove('picked-out');
            }
            activePickedSlot = sourceSlot || null;
            if (sourceSlot) {
                sourceSlot.classList.add('picked-out');
            }

            initThreeCube(wordData);

            vault.classList.add('defocused');
            board.classList.add('blurred-bg');

            holder.classList.remove('approached');
            cubeStage.style.display = 'flex';
            holder.offsetHeight;

            requestAnimationFrame(() => {
                holder.classList.add('approached');
            });
        }

        function returnToVault() {
            const vault = document.getElementById('memoryVault');
            const cubeStage = document.getElementById('cubeStage');
            const holder = document.getElementById('cubeDepthHolder');
            const board = document.getElementById('retroBoard');

            if (activePickedSlot) {
                activePickedSlot.classList.remove('picked-out');
                activePickedSlot = null;
            }

            holder.classList.remove('approached');
            board.classList.remove('blurred-bg');
            vault.classList.remove('defocused');
            cubeStage.style.display = 'none';
        }

        function alignYToUprightFront() {
            targetRotY = Math.round(targetRotY / 360) * 360;
        }

        function tiltUp() {
            alignYToUprightFront();
            targetRotX = targetRotX > 0 ? 0 : -90;
        }

        function tiltDown() {
            alignYToUprightFront();
            targetRotX = targetRotX < 0 ? 0 : 90;
        }

        function turnLeft() {
            targetRotX = 0;
            targetRotY += 90;
        }

        function turnRight() {
            targetRotX = 0;
            targetRotY -= 90;
        }

        function turnBack() {
            targetRotX = 0;
            targetRotY += 180;
        }
    </script>
