<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Alien Memory Scanner</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --ink-dark: #18181b;
            --cube-edge: #9b9282;
            --wrong-text: #7e22ce;
            --correct-text: #15803d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #145359;
            color: var(--ink-dark);
            overflow: hidden;
        }

        .retro-board {
            width: 100vw;
            height: 100dvh;
            background-color: #145359;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px 14px;
            position: relative;
            overflow: hidden;
        }

        /* Background layers */
        .bg-layer {
            position: absolute;
            width: 108vw;
            height: 108dvh;
            top: -4dvh;
            left: -4vw;
            z-index: 0;
            pointer-events: none;
            transition: opacity 0.45s ease, filter 0.45s ease;
        }

        .bg-first-page {
            background-image: url('background%20first%20page.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 1;
        }

        .bg-clouds-page {
            background-image: url('Background1.webp');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: saturate(0.8) brightness(1.02);
            opacity: 0;
        }

        .bg-vault-page {
            background-image: url('Background2.webp');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
        }

        .retro-board.clouds-bg .bg-first-page,
        .retro-board.clouds-bg .bg-vault-page {
            opacity: 0;
        }

        .retro-board.clouds-bg .bg-clouds-page {
            opacity: 1;
        }

        .retro-board.vault-bg .bg-first-page,
        .retro-board.vault-bg .bg-clouds-page {
            opacity: 0;
        }

        .retro-board.vault-bg .bg-vault-page {
            opacity: 1;
        }

        .retro-board.blurred-bg .bg-layer {
            filter: blur(5px) brightness(0.86);
        }

        .content-wrap {
            width: 100%;
            max-width: 360px;
            height: 100%;
            z-index: 2;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Horizontal page slide transitions */
        .page-slide {
            position: absolute;
            inset: 0;
            margin: auto;
            width: 100%;
            height: fit-content;
            opacity: 1;
            transition: transform 0.72s cubic-bezier(0.16, 1, 0.3, 1), filter 0.45s ease;
            will-change: transform, filter;
        }

        .page-slide.enter-from-right {
            transform: translateX(120vw);
        }

        .page-slide.exit-to-left {
            transform: translateX(-120vw);
            pointer-events: none;
        }

        .page-slide.active-center {
            transform: translateX(0);
        }

        /* 1. INTRO SCREEN */
        .intro-screen {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .intro-illustration {
            width: auto;
            max-width: 190px;
            max-height: 34dvh;
            height: auto;
            object-fit: contain;
            margin-bottom: 12px;
            user-select: none;
            -webkit-user-drag: none;
        }

        .narrative-box {
            width: 100%;
            background-image: url('frame.png');
            background-size: cover;
            background-position: center;
            border: 2px solid var(--ink-dark);
            border-radius: 14px;
            overflow: hidden;
            padding: 14px 16px;
            margin-bottom: 12px;
            box-shadow: 2px 3px 0px var(--ink-dark);
        }

        .narrative-text {
            font-size: 12.5px;
            line-height: 1.42;
            color: var(--ink-dark);
            font-weight: 500;
            text-align: justify;
            text-align-last: left;
        }

        .scan-btn {
            position: relative;
            background-image: url('frame.png');
            background-size: cover;
            background-position: center;
            border: 2px solid var(--ink-dark);
            border-radius: 14px;
            overflow: hidden;
            color: var(--ink-dark);
            padding: 12px 24px;
            width: 100%;
            max-width: 280px;
            font-size: 12.5px;
            font-weight: 800;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 2px 3px 0px var(--ink-dark);
            transition: transform 0.18s ease, box-shadow 0.18s ease;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .scan-btn::before,
        .btn-action::before {
            content: '';
            position: absolute;
            inset: 0;
            background-color: rgba(252, 211, 77, 0.72);
            pointer-events: none;
            z-index: 0;
        }

        .btn-action.saved-state::before {
            background-color: rgba(134, 239, 172, 0.78);
        }

        .scan-btn span,
        .btn-action span {
            position: relative;
            z-index: 1;
        }

        .scan-btn:active,
        .scan-btn.pressed {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px var(--ink-dark);
        }

        /* 2. SCAN WORKSPACE */
        .scan-workspace {
            width: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
        }

        .riddle-box {
            width: 100%;
            background-image: url('frame.png');
            background-size: cover;
            background-position: center;
            border: 2px solid var(--ink-dark);
            border-radius: 14px;
            overflow: hidden;
            padding: 12px 16px;
            text-align: center;
            margin-bottom: 12px;
            box-shadow: 2px 3px 0px var(--ink-dark);
        }

        .riddle-text {
            font-size: 14px;
            line-height: 1.35;
            font-weight: 700;
            color: var(--ink-dark);
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 100%;
            margin-bottom: 14px;
            opacity: 1;
        }

        .card-slot {
            perspective: 800px;
            height: 88px;
        }

        .mini-cube-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            -webkit-transform-style: preserve-3d;
            animation: mini-levitate 4s ease-in-out infinite;
            cursor: pointer;
        }

        @keyframes mini-levitate {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-3px); }
        }

        .mini-cube {
            width: 100%;
            height: 100%;
            position: absolute;
            transform-style: preserve-3d;
            -webkit-transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .card-slot.flipped .mini-cube {
            transform: rotateY(180deg);
        }

        .mini-face {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            background-image: url('frame.png');
            background-size: cover;
            background-position: center;
            border: 2px solid var(--ink-dark);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 10px;
            text-align: center;
            box-shadow: 2px 3px 0px var(--ink-dark);
        }

        .mini-face-back {
            transform: rotateY(180deg);
        }

        .card-emoji { font-size: 22px; margin-bottom: 2px; }
        .card-title { font-size: 12px; font-weight: 700; color: var(--ink-dark); }

        .card-slot.wrong .mini-face-back span {
            color: var(--wrong-text);
            font-weight: 800;
            font-size: 10.5px;
            line-height: 1.25;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .card-slot:not(.wrong) .mini-face-back span {
            font-size: 11px;
            line-height: 1.3;
            font-weight: 600;
            color: var(--ink-dark);
            text-align: center;
        }

        .card-slot.correct .mini-face-back div {
            color: var(--correct-text);
        }

        .action-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 100%;
            opacity: 1;
            transform: translateX(-120vw);
            pointer-events: none;
            transition: transform 0.65s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: transform;
        }

        .action-row.visible {
            transform: translateX(0);
            pointer-events: auto;
        }

        .btn-action {
            position: relative;
            background-image: url('frame.png');
            background-size: cover;
            background-position: center;
            border: 2px solid var(--ink-dark);
            border-radius: 14px;
            overflow: hidden;
            color: var(--ink-dark);
            padding: 12px 10px;
            font-size: 11.5px;
            font-weight: 800;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            cursor: pointer;
            width: 100%;
            box-shadow: 2px 3px 0px var(--ink-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .btn-action:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px var(--ink-dark);
        }

        /* 3. MEMORY STORAGE CENTERED 2x2 WITH HORIZONTAL SCROLL */
        .memory-vault {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            transition: transform 0.72s cubic-bezier(0.16, 1, 0.3, 1), filter 0.45s ease;
        }

        .memory-vault.defocused {
            filter: blur(5px) brightness(0.84);
            pointer-events: none;
        }

        .vault-scroll {
            position: relative;
            width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            padding: 24px 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .vault-scroll.has-overflow {
            justify-content: flex-start;
        }

        .vault-scroll::-webkit-scrollbar {
            display: none;
        }

        .vault-grid {
            display: grid;
            grid-template-rows: repeat(2, 82px);
            grid-auto-flow: column;
            grid-auto-columns: 82px;
            row-gap: 34px;
            column-gap: 36px;
            width: max-content;
            align-items: center;
            justify-items: center;
            padding: 8px 6px;
        }

        .node-wrapper {
            width: 82px;
            height: 82px;
            cursor: pointer;
            perspective: 750px;
            animation: node-levitate 4.4s ease-in-out infinite;
            flex-shrink: 0;
        }

        .node-wrapper.picked-out {
            visibility: hidden;
            pointer-events: none;
        }

        @keyframes node-levitate {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }

        .node-cube {
            width: 82px;
            height: 82px;
            position: relative;
            transform-style: preserve-3d;
            -webkit-transform-style: preserve-3d;
            will-change: transform;
        }

        .node-face {
            position: absolute;
            top: 0;
            left: 0;
            width: 82px;
            height: 82px;
            border: 1.5px solid var(--cube-edge);
            border-radius: 0;
            background-image: url('frame.png');
            background-size: cover;
            background-position: center;
            filter: saturate(0.72) contrast(0.96) brightness(0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 5px;
            text-align: center;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            overflow: hidden;
        }

        .node-face::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(145deg, rgba(99, 102, 241, 0.14) 0%, rgba(168, 85, 247, 0.10) 65%, rgba(59, 130, 246, 0.06) 100%);
            pointer-events: none;
        }

        .node-front  { transform: rotateY(  0deg) translateZ(41px); }
        .node-right  { transform: rotateY( 90deg) translateZ(41px); }
        .node-back   { transform: rotateY(180deg) translateZ(41px); }
        .node-left   { transform: rotateY(270deg) translateZ(41px); }
        .node-top    { transform: rotateX( 90deg) translateZ(41px); }
        .node-bottom { transform: rotateX(-90deg) translateZ(41px); }

        .node-word {
            position: relative;
            z-index: 1;
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 0.03em;
            color: var(--ink-dark);
            text-transform: uppercase;
            word-break: break-word;
            line-height: 1.15;
        }

        /* 4. THREE.JS WEBGL 3D CUBE STAGE */
        .cube-stage {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100%;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
            position: relative;
        }

        .back-network-btn {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #d9779a;
            background-image: url('frame.png');
            background-size: cover;
            background-position: center;
            border: 2px solid var(--ink-dark);
            border-radius: 12px;
            overflow: hidden;
            color: var(--ink-dark);
            padding: 8px 16px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 2px 2px 0px var(--ink-dark);
            z-index: 30;
            white-space: nowrap;
        }

        .back-network-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background-color: rgba(236, 122, 162, 0.72);
            pointer-events: none;
            z-index: 0;
        }

        .back-network-btn span {
            position: relative;
            z-index: 1;
        }

        .back-network-btn:active {
            transform: translateX(-50%) translate(2px, 2px);
            box-shadow: 1px 1px 0px var(--ink-dark);
        }

        .webgl-cube-holder {
            position: relative;
            width: 240px;
            height: 240px;
            margin-top: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: scale(0.75);
            transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .webgl-cube-holder.approached {
            transform: translateY(18px) scale(1.04);
        }

        #threeCanvasHost {
            width: 240px;
            height: 240px;
            position: relative;
            z-index: 5;
        }

        .touch-overlay {
            position: absolute;
            inset: 8px;
            z-index: 20;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
        }

        .zone {
            cursor: pointer;
            background: transparent;
            border: none;
        }

        /* Crosshair Controls */
        .crosshair-pad {
            position: relative;
            width: 70px;
            height: 70px;
            margin-top: calc(22px + 8dvh);
            opacity: 1;
            pointer-events: auto;
            z-index: 25;
        }

        .line-btn {
            position: absolute;
            background: transparent;
            border: none;
            outline: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .line-btn::after {
            content: '';
            display: block;
            background-image: url('frame.png');
            background-size: cover;
            border: 1.5px solid var(--ink-dark);
            border-radius: 4px;
            box-shadow: 2px 2px 0px var(--ink-dark);
            transition: transform 0.18s ease, background-color 0.2s ease;
        }

        .line-btn:active::after {
            transform: scale(0.84);
            background-color: #fcd34d;
        }

        .line-up {
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 26px;
            height: 28px;
        }
        .line-up::after { width: 5px; height: 22px; }

        .line-down {
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 26px;
            height: 28px;
        }
        .line-down::after { width: 5px; height: 22px; }

        .line-left {
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 28px;
            height: 26px;
        }
        .line-left::after { width: 22px; height: 5px; }

        .line-right {
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 28px;
            height: 26px;
        }
        .line-right::after { width: 22px; height: 5px; }
    </style>
</head>
<body>

    <div class="retro-board" id="retroBoard">
        <!-- Background Layers -->
        <div class="bg-layer bg-first-page"></div>
        <div class="bg-layer bg-clouds-page"></div>
        <div class="bg-layer bg-vault-page"></div>

        <div class="content-wrap">

            <!-- Screen 1: Intro Narrative -->
            <div class="intro-screen page-slide active-center" id="introScreen">
                <img src="Igor%20and%20the%20apple.png" alt="Igor in the orchard" class="intro-illustration">

                <div class="narrative-box">
                    <p class="narrative-text">
                        Igor wandered into an orchard and saw various fruits lying on the ground. While looking around, something suddenly fell on his head. It was red and firm. And it was...
                    </p>
                </div>

                <button class="scan-btn" id="scanBtn" onclick="startScan()"><span>Object Scanning</span></button>
            </div>

            <!-- Screen 2: Hand-Drawn Mini-Cube Quiz Choices -->
            <div class="scan-workspace page-slide" id="scanWorkspace">
                <div class="riddle-box">
                    <div class="riddle-text">The fruit that fell on Igor’s head</div>
                </div>

                <div class="cards-grid" id="cardsGrid">
                    <!-- Card 0: Plum -->
                    <div class="card-slot" id="card0" data-correct="false">
                        <div class="mini-cube-wrapper" onclick="handleCardTap(this.parentElement)">
                            <div class="mini-cube">
                                <div class="mini-face">
                                    <div class="card-emoji">🍑</div>
                                    <div class="card-title">Plum</div>
                                </div>
                                <div class="mini-face mini-face-back">
                                    <span>Scan error</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Card 1: Orange -->
                    <div class="card-slot" id="card1" data-correct="false">
                        <div class="mini-cube-wrapper" onclick="handleCardTap(this.parentElement)">
                            <div class="mini-cube">
                                <div class="mini-face">
                                    <div class="card-emoji">🍊</div>
                                    <div class="card-title">Orange</div>
                                </div>
                                <div class="mini-face mini-face-back">
                                    <span>Scan error</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Card 2: Pear -->
                    <div class="card-slot" id="card2" data-correct="false">
                        <div class="mini-cube-wrapper" onclick="handleCardTap(this.parentElement)">
                            <div class="mini-cube">
                                <div class="mini-face">
                                    <div class="card-emoji">🍐</div>
                                    <div class="card-title">Pear</div>
                                </div>
                                <div class="mini-face mini-face-back">
                                    <span>Scan error</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Card 3: Apple -->
                    <div class="card-slot" id="card3" data-correct="true">
                        <div class="mini-cube-wrapper" onclick="handleCardTap(this.parentElement)">
                            <div class="mini-cube">
                                <div class="mini-face">
                                    <div class="card-emoji">🍎</div>
                                    <div class="card-title">Apple</div>
                                </div>
                                <div class="mini-face mini-face-back">
                                    <div style="font-weight: 800; font-size: 13px; letter-spacing: 0.05em;">APPLE</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="action-row" id="actionRow">
                    <button class="btn-action" id="saveCubeBtn" onclick="saveInCube()"><span>Save in Cube</span></button>
                    <button class="btn-action" id="goCubeBtn" onclick="openMemoryVault()"><span>Go to Cube</span></button>
                </div>
            </div>

            <!-- Screen 3: Memory Storage Centered 2x2 with Horizontal Scroll -->
            <div class="memory-vault page-slide" id="memoryVault">
                <div class="vault-scroll" id="vaultScroll">
                    <div class="vault-grid" id="vaultGrid"></div>
                </div>
            </div>

            <!-- Screen 4: Three.js WebGL 3D Cube Inspection -->
            <div class="cube-stage page-slide assembled" id="cubeStage">
                <button class="back-network-btn" onclick="returnToVault()"><span>← Back to Grid</span></button>

                <div class="webgl-cube-holder" id="cubeDepthHolder">
                    <div id="threeCanvasHost"></div>
                    <div class="touch-overlay">
                        <div class="zone" onclick="tiltUp()"></div>
                        <div class="zone" onclick="tiltUp()"></div>
                        <div class="zone" onclick="tiltUp()"></div>

                        <div class="zone" onclick="turnLeft()"></div>
                        <div class="zone" onclick="turnBack()"></div>
                        <div class="zone" onclick="turnRight()"></div>

                        <div class="zone" onclick="tiltDown()"></div>
                        <div class="zone" onclick="tiltDown()"></div>
                        <div class="zone" onclick="tiltDown()"></div>
                    </div>
                </div>

                <!-- Crosshair Controls -->
                <div class="crosshair-pad">
                    <button class="line-btn line-up" onclick="tiltUp()" aria-label="Top Face"></button>
                    <button class="line-btn line-left" onclick="turnLeft()" aria-label="Left Face"></button>
                    <button class="line-btn line-right" onclick="turnRight()" aria-label="Right Face"></button>
                    <button class="line-btn line-down" onclick="tiltDown()" aria-label="Bottom Face"></button>
                </div>
            </div>

        </div>
    </div>

    <script>
        let isSolved = false;
        let isAppleSaved = false;
        let vaultSpinRaf = null;
        let activePickedWrapper = null;

        // Three.js state
        let scene, camera, renderer, stoneCubeMesh, outlineMesh;
        let targetRotX = 0;
        let targetRotY = 0;
        let currentRotX = 0;
        let currentRotY = 0;
        let threeAnimId = null;
        let currentWordData = null;

        const CUBE_OFFSETS = [
            { x: -3, y: 2 },  { x: 4, y: -3 },
            { x: 3, y: 3 },   { x: -4, y: -2 }
        ];

        const DEFAULT_WORDS = [
            {
                id: 'orchard',
                word: 'ORCHARD',
                phonetic: '/ˈɔː.tʃəd/',
                definition: 'A piece of land planted with fruit trees',
                ex1: 'Igor walked slowly into an old orchard.',
                ex2: 'The apple trees in the orchard were full of fruit.',
                ex3: 'Autumn is the best season to visit an orchard.',
                visual: '🌳'
            },
            {
                id: 'firm',
                word: 'FIRM',
                phonetic: '/fɜːm/',
                definition: 'Hard and solid when pressed, not soft',
                ex1: 'The red fruit felt smooth and firm.',
                ex2: 'She picked a firm apple from the basket.',
                ex3: 'This mattress is comfortable and firm.',
                visual: '🧱'
            },
            {
                id: 'ground',
                word: 'GROUND',
                phonetic: '/ɡraʊnd/',
                definition: 'The solid surface of the earth',
                ex1: 'Various fruits were lying on the ground.',
                ex2: 'The ripe apple fell softly onto the ground.',
                ex3: 'Leaves covered the wet ground after rain.',
                visual: '🌱'
            },
            {
                id: 'head',
                word: 'HEAD',
                phonetic: '/hed/',
                definition: 'The upper part of the human body',
                ex1: 'Something suddenly fell right on Igor’s head.',
                ex2: 'He rubbed the top of his head in surprise.',
                ex3: 'A clever idea popped into his head.',
                visual: '👽'
            }
        ];

        const APPLE_WORD = {
            id: 'apple',
            word: 'APPLE',
            phonetic: '/ˈæp.əl/',
            definition: 'The fruit that fell on Igor’s head',
            ex1: 'I eat a fresh apple every morning.',
            ex2: 'She cut the apple into four equal pieces.',
            ex3: 'This green apple tastes quite sour.',
            visual: '🍎'
        };

        currentWordData = APPLE_WORD;

        function getStoredWords() {
            try {
                const raw = localStorage.getItem('alien_memory_cubes_v6');
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed) && parsed.length > 0) return parsed;
                }
            } catch (e) {}
            return [...DEFAULT_WORDS];
        }

        function saveStoredWords(words) {
            try {
                localStorage.setItem('alien_memory_cubes_v6', JSON.stringify(words));
            } catch (e) {}
        }

        function slideBetweenPages(fromEl, toEl, onAfterShow) {
            fromEl.classList.remove('active-center');
            fromEl.classList.add('exit-to-left');

            toEl.style.display = 'flex';
            toEl.classList.remove('exit-to-left', 'active-center');
            toEl.classList.add('enter-from-right');
            toEl.offsetHeight;

            requestAnimationFrame(() => {
                toEl.classList.remove('enter-from-right');
                toEl.classList.add('active-center');
            });

            if (typeof onAfterShow === 'function') {
                onAfterShow();
            }

            setTimeout(() => {
                fromEl.style.display = 'none';
                fromEl.classList.remove('exit-to-left');
            }, 720);
        }

        function startScan() {
            const btn = document.getElementById('scanBtn');
            const intro = document.getElementById('introScreen');
            const workspace = document.getElementById('scanWorkspace');
            const board = document.getElementById('retroBoard');

            btn.classList.add('pressed');

            setTimeout(() => {
                btn.classList.remove('pressed');
                board.classList.remove('vault-bg');
                board.classList.add('clouds-bg');
                slideBetweenPages(intro, workspace);
            }, 180);
        }

        function handleCardTap(slot) {
            if (isSolved) return;

            const slotEl = slot.closest('.card-slot');
            const isCorrect = slotEl.dataset.correct === 'true';

            if (isCorrect) {
                isSolved = true;
                slotEl.classList.add('correct', 'flipped');

                const otherExamples = [
                    "I eat a fresh apple every morning.",
                    "She cut the apple into four equal pieces.",
                    "This green apple tastes quite sour."
                ];

                let exIdx = 0;
                document.querySelectorAll('.card-slot').forEach((otherSlot) => {
                    if (otherSlot !== slotEl) {
                        otherSlot.classList.remove('wrong');
                        otherSlot.querySelector('.mini-face-back span').textContent = otherExamples[exIdx++];
                        otherSlot.classList.add('flipped');
                    }
                });

                const actionRow = document.getElementById('actionRow');
                actionRow.classList.remove('visible');
                actionRow.offsetHeight;
                requestAnimationFrame(() => {
                    actionRow.classList.add('visible');
                });
            } else {
                const willFlip = !slotEl.classList.contains('flipped');
                slotEl.classList.toggle('flipped', willFlip);
                slotEl.classList.toggle('wrong', willFlip);
            }
        }

        function saveInCube() {
            if (isAppleSaved) return;
            isAppleSaved = true;

            const words = getStoredWords();
            if (!words.some(w => w.id === 'apple')) {
                words.unshift(APPLE_WORD);
                saveStoredWords(words);
            }

            const btn = document.getElementById('saveCubeBtn');
            btn.classList.add('saved-state');
            btn.querySelector('span').textContent = 'Saved ✓';
        }

        function openMemoryVault() {
            const workspace = document.getElementById('scanWorkspace');
            const vault = document.getElementById('memoryVault');
            const board = document.getElementById('retroBoard');

            const words = getStoredWords();
            if (!words.some(w => w.id === 'apple')) {
                words.unshift(APPLE_WORD);
                saveStoredWords(words);
            }

            renderVaultGrid(words);
            board.classList.remove('clouds-bg', 'blurred-bg');
            board.classList.add('vault-bg');
            vault.classList.remove('defocused');

            slideBetweenPages(workspace, vault, () => {
                startVaultSpinning();
            });
        }

        function renderVaultGrid(words) {
            const grid = document.getElementById('vaultGrid');
            const scrollEl = document.getElementById('vaultScroll');
            grid.innerHTML = '';

            const visibleWords = words.slice(0, 4);

            visibleWords.forEach((item, index) => {
                const offset = CUBE_OFFSETS[index % CUBE_OFFSETS.length];
                const wrapper = document.createElement('div');
                wrapper.className = 'node-wrapper';
                wrapper.style.marginLeft = offset.x + 'px';
                wrapper.style.marginTop = offset.y + 'px';
                wrapper.style.animationDelay = ((index * 0.45) % 3.2) + 's';
                wrapper.dataset.angle = ((index * 35) % 360).toString();

                wrapper.innerHTML = `
                    <div class="node-cube">
                        <div class="node-face node-front"><div class="node-word">${item.word}</div></div>
                        <div class="node-face node-right"><div class="node-word">${item.word}</div></div>
                        <div class="node-face node-back"><div class="node-word">${item.word}</div></div>
                        <div class="node-face node-left"><div class="node-word">${item.word}</div></div>
                        <div class="node-face node-top"><div class="node-word">${item.word}</div></div>
                        <div class="node-face node-bottom"><div class="node-word">${item.word}</div></div>
                    </div>
                `;

                wrapper.onclick = () => inspectMemoryCube(item, wrapper);
                grid.appendChild(wrapper);
            });

            scrollEl.classList.toggle('has-overflow', grid.scrollWidth > scrollEl.clientWidth);
        }

        function startVaultSpinning() {
            if (vaultSpinRaf) cancelAnimationFrame(vaultSpinRaf);
            let lastTime = performance.now();

            function step(now) {
                const delta = now - lastTime;
                lastTime = now;
                const wrappers = document.querySelectorAll('#vaultGrid .node-wrapper');
                wrappers.forEach((w) => {
                    if (w.classList.contains('picked-out')) return;
                    let angle = (parseFloat(w.dataset.angle || '0') + delta * 0.0105) % 360;
                    w.dataset.angle = angle.toFixed(2);
                    const cubeEl = w.querySelector('.node-cube');
                    if (cubeEl) {
                        cubeEl.style.transform = `translateZ(-41px) rotateX(-13deg) rotateY(${angle.toFixed(1)}deg)`;
                    }
                });
                vaultSpinRaf = requestAnimationFrame(step);
            }

            vaultSpinRaf = requestAnimationFrame(step);
        }

        // Create comic-stone canvas texture for each face with subtle blue-violet tint
        function createStoneFaceTexture(lines, options = {}) {
            const size = 512;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            // Raw parchment / stone base
            const baseGrad = ctx.createLinearGradient(0, 0, size, size);
            baseGrad.addColorStop(0, '#e5dec9');
            baseGrad.addColorStop(0.55, '#dcd2bb');
            baseGrad.addColorStop(1, '#cfc3ae');
            ctx.fillStyle = baseGrad;
            ctx.fillRect(0, 0, size, size);

            // Subtle blue-violet reflection overlay matching Background2.webp
            const reflGrad = ctx.createLinearGradient(0, 0, size * 0.85, size);
            reflGrad.addColorStop(0, 'rgba(99, 102, 241, 0.16)');
            reflGrad.addColorStop(0.55, 'rgba(168, 85, 247, 0.12)');
            reflGrad.addColorStop(1, 'rgba(59, 130, 246, 0.07)');
            ctx.fillStyle = reflGrad;
            ctx.fillRect(0, 0, size, size);

            // Comic stone blotches & speckles
            for (let i = 0; i < 42; i++) {
                const x = ((i * 97) % (size - 40)) + 20;
                const y = ((i * 151) % (size - 40)) + 20;
                const r = 10 + ((i * 13) % 28);
                ctx.fillStyle = i % 3 === 0
                    ? 'rgba(126, 87, 194, 0.08)'
                    : i % 2 === 0
                        ? 'rgba(79, 70, 229, 0.07)'
                        : 'rgba(120, 113, 108, 0.08)';
                ctx.beginPath();
                ctx.ellipse(x, y, r * 1.2, r * 0.75, (i * 0.4) % Math.PI, 0, Math.PI * 2);
                ctx.fill();
            }

            // Fine grain speckles
            for (let j = 0; j < 450; j++) {
                const gx = (j * 73 + 19) % size;
                const gy = (j * 137 + 11) % size;
                ctx.fillStyle = j % 2 === 0 ? 'rgba(24, 24, 27, 0.07)' : 'rgba(255, 255, 255, 0.12)';
                ctx.fillRect(gx, gy, 2, 2);
            }

            // Inner comic border in cube-matched tone
            ctx.strokeStyle = 'rgba(120, 110, 96, 0.65)';
            ctx.lineWidth = 8;
            ctx.strokeRect(10, 10, size - 20, size - 20);

            // Render text or emoji
            ctx.fillStyle = '#18181b';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            if (options.isEmoji) {
                ctx.font = '140px sans-serif';
                ctx.fillText(lines[0], size / 2, size / 2 + 6);
            } else if (options.isTitle) {
                ctx.font = '900 72px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
                ctx.fillText(lines[0], size / 2, size / 2 - 22);
                if (lines[1]) {
                    ctx.font = '600 32px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
                    ctx.fillStyle = '#44403c';
                    ctx.fillText(lines[1], size / 2, size / 2 + 44);
                }
            } else {
                const fontSize = options.fontSize || 38;
                ctx.font = `700 ${fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
                const text = lines.join(' ');
                const words = text.split(' ');
                const wrapped = [];
                let currentLine = '';

                words.forEach((w) => {
                    const testLine = currentLine ? currentLine + ' ' + w : w;
                    if (ctx.measureText(testLine).width > size - 84 && currentLine) {
                        wrapped.push(currentLine);
                        currentLine = w;
                    } else {
                        currentLine = testLine;
                    }
                });
                if (currentLine) wrapped.push(currentLine);

                const lineHeight = fontSize * 1.28;
                const startY = size / 2 - ((wrapped.length - 1) * lineHeight) / 2;
                wrapped.forEach((line, idx) => {
                    ctx.fillText(line, size / 2, startY + idx * lineHeight);
                });
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.anisotropy = 4;
            return tex;
        }

        function initThreeCube(wordData) {
            const host = document.getElementById('threeCanvasHost');
            if (!host || typeof THREE === 'undefined') return;

            if (!renderer) {
                scene = new THREE.Scene();
                camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
                camera.position.set(0, 0, 5.2);

                renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setSize(240, 240);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
                host.innerHTML = '';
                host.appendChild(renderer.domElement);

                const ambient = new THREE.AmbientLight(0xd8d0f0, 0.92);
                scene.add(ambient);

                const keyLight = new THREE.DirectionalLight(0xfff7ed, 0.72);
                keyLight.position.set(2.5, 4, 4);
                scene.add(keyLight);

                const rimLight = new THREE.DirectionalLight(0x818cf8, 0.38);
                rimLight.position.set(-3, -2, -2);
                scene.add(rimLight);
            }

            if (stoneCubeMesh) {
                scene.remove(stoneCubeMesh);
            }

            // Slightly subdivided box with subtle organic rock displacement
            const geom = new THREE.BoxGeometry(2.05, 2.05, 2.05, 10, 10, 10);
            const pos = geom.attributes.position;
            for (let i = 0; i < pos.count; i++) {
                const vx = pos.getX(i);
                const vy = pos.getY(i);
                const vz = pos.getZ(i);
                const jitter = 0.022 * Math.sin(vx * 7.3 + vy * 5.1) * Math.cos(vz * 6.7);
                pos.setXYZ(i, vx + jitter, vy - jitter * 0.8, vz + jitter * 0.6);
            }
            geom.computeVertexNormals();

            const textures = [
                createStoneFaceTexture([wordData.ex1], { fontSize: 36 }),                 // Right (+X)
                createStoneFaceTexture([wordData.ex2], { fontSize: 36 }),                 // Left (-X)
                createStoneFaceTexture([wordData.definition], { fontSize: 36 }),           // Top (+Y)
                createStoneFaceTexture([wordData.visual], { isEmoji: true }),              // Bottom (-Y)
                createStoneFaceTexture([wordData.word, wordData.phonetic], { isTitle: true }), // Front (+Z)
                createStoneFaceTexture([wordData.ex3], { fontSize: 36 })                  // Back (-Z)
            ];

            const materials = textures.map((tex) => new THREE.MeshStandardMaterial({
                map: tex,
                roughness: 0.78,
                metalness: 0.06
            }));

            stoneCubeMesh = new THREE.Mesh(geom, materials);

            // Subtle dark comic-style wireframe edge accent
            const edgesGeom = new THREE.EdgesGeometry(new THREE.BoxGeometry(2.06, 2.06, 2.06));
            const edgesMat = new THREE.LineBasicMaterial({ color: 0x27272a, transparent: true, opacity: 0.55 });
            outlineMesh = new THREE.LineSegments(edgesGeom, edgesMat);
            stoneCubeMesh.add(outlineMesh);

            scene.add(stoneCubeMesh);

            targetRotX = 0;
            targetRotY = 0;
            currentRotX = 0;
            currentRotY = 0;
            stoneCubeMesh.rotation.set(0, 0, 0);

            if (!threeAnimId) {
                renderThreeLoop();
            }
        }

        function renderThreeLoop() {
            threeAnimId = requestAnimationFrame(renderThreeLoop);
            if (!renderer || !scene || !camera) return;

            currentRotX += (targetRotX - currentRotX) * 0.14;
            currentRotY += (targetRotY - currentRotY) * 0.14;

            if (stoneCubeMesh) {
                stoneCubeMesh.rotation.x = THREE.MathUtils.degToRad(currentRotX);
                stoneCubeMesh.rotation.y = THREE.MathUtils.degToRad(currentRotY);
                stoneCubeMesh.position.y = Math.sin(performance.now() * 0.0022) * 0.06;
            }

            renderer.render(scene, camera);
        }

        function inspectMemoryCube(wordData, sourceWrapper) {
            const vault = document.getElementById('memoryVault');
            const cubeStage = document.getElementById('cubeStage');
            const holder = document.getElementById('cubeDepthHolder');
            const board = document.getElementById('retroBoard');

            currentWordData = wordData;

            if (activePickedWrapper) {
                activePickedWrapper.classList.remove('picked-out');
            }
            activePickedWrapper = sourceWrapper || null;
            if (sourceWrapper) {
                sourceWrapper.classList.add('picked-out');
            }

            initThreeCube(wordData);

            vault.classList.add('defocused');
            board.classList.add('blurred-bg');

            holder.classList.remove('approached');
            cubeStage.style.display = 'flex';
            cubeStage.classList.remove('exit-to-left');
            cubeStage.classList.add('active-center');
            holder.offsetHeight;

            requestAnimationFrame(() => {
                holder.classList.add('approached');
            });
        }

        function returnToVault() {
            const vault = document.getElementById('memoryVault');
            const cubeStage = document.getElementById('cubeStage');
            const holder = document.getElementById('cubeDepthHolder');
            const board = document.getElementById('retroBoard');

            if (activePickedWrapper) {
                activePickedWrapper.classList.remove('picked-out');
                activePickedWrapper = null;
            }

            holder.classList.remove('approached');
            board.classList.remove('blurred-bg');
            vault.classList.remove('defocused');
            cubeStage.style.display = 'none';
        }

        function alignYToUprightFront() {
            targetRotY = Math.round(targetRotY / 360) * 360;
        }

        function tiltUp() {
            alignYToUprightFront();
            targetRotX = targetRotX > 0 ? 0 : -90;
        }

        function tiltDown() {
            alignYToUprightFront();
            targetRotX = targetRotX < 0 ? 0 : 90;
        }

        function turnLeft() {
            targetRotX = 0;
            targetRotY += 90;
        }

        function turnRight() {
            targetRotX = 0;
            targetRotY -= 90;
        }

        function turnBack() {
            targetRotX = 0;
            targetRotY += 180;
        }
    </script>
</body>
