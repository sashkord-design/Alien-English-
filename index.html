<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Alien Memory Scanner</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --ink-dark: #18181b;
            --story-bg: #ece5d5;
            --wrong-text: #7e22ce;
            --correct-text: #15803d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--story-bg);
            color: var(--ink-dark);
            overflow: hidden;
        }

        .retro-board {
            width: 100vw;
            height: 100dvh;
            background-color: var(--story-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px 14px 12px;
            position: relative;
            overflow: hidden;
        }

        /* Background layers */
        .bg-layer {
            position: absolute;
            width: 108vw;
            height: 108dvh;
            top: -4dvh;
            left: -4vw;
            z-index: 0;
            pointer-events: none;
            transition: opacity 0.45s ease, filter 0.45s ease;
        }

        .bg-first-page {
            background:
                radial-gradient(circle at 50% 24%, rgba(255, 250, 238, 0.72) 0%, rgba(236, 229, 213, 0.25) 58%, rgba(212, 201, 178, 0.65) 100%),
                repeating-radial-gradient(circle at 20% 30%, rgba(24, 24, 27, 0.025) 0 1px, transparent 1px 6px);
            background-color: var(--story-bg);
            opacity: 1;
        }

        .bg-clouds-page {
            background-image: url('Background1.webp');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: saturate(0.8) brightness(1.02);
            opacity: 0;
        }

        .bg-vault-page {
            background-image: url('Background2.webp');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
        }

        .retro-board.clouds-bg .bg-first-page,
        .retro-board.clouds-bg .bg-vault-page {
            opacity: 0;
        }

        .retro-board.clouds-bg .bg-clouds-page {
            opacity: 1;
        }

        .retro-board.vault-bg .bg-first-page,
        .retro-board.vault-bg .bg-clouds-page {
            opacity: 0;
        }

        .retro-board.vault-bg .bg-vault-page {
            opacity: 1;
        }

        .retro-board.blurred-bg .bg-layer {
            filter: blur(5px) brightness(0.86);
        }

        .content-wrap {
            width: 100%;
            max-width: 360px;
            height: 100%;
            z-index: 2;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Horizontal page slide transitions */
        .page-slide {
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            bottom: 0;
            margin: auto;
            width: 100%;
            opacity: 1;
            transition: transform 0.72s cubic-bezier(0.16, 1, 0.3, 1), filter 0.45s ease;
            will-change: transform, filter;
        }

        .page-slide.enter-from-right {
            transform: translateX(120vw);
        }

        .page-slide.exit-to-left {
            transform: translateX(-120vw);
            pointer-events: none;
        }

        .page-slide.active-center {
            transform: translateX(0);
        }

        /* 1. INTRO SCREEN */
        .intro-screen {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 2px 0 4px;
        }

        .intro-frame-box {
            width: 100%;
            height: 30dvh;
            min-height: 150px;
            max-height: 260px;
            background-image: url('frame.png');
            background-size: cover;
            background-position: center;
            border: 2px solid var(--ink-dark);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 2px 3px 0px var(--ink-dark);
            flex-shrink: 0;
        }

        .intro-illustration {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            object-position: center 22%;
            user-select: none;
            -webkit-user-drag: none;
        }

        .narrative-box {
            width: 100%;
            height: 36dvh;
            min-height: 155px;
            max-height: 290px;
            background-image: url('frame.png');
            background-size: cover;
            background-position: center;
            border: 2px solid var(--ink-dark);
            border-radius: 14px;
            overflow: hidden;
            padding: 12px 15px 8px;
            box-shadow: 2px 3px 0px var(--ink-dark);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .narrative-body {
            flex: 1;
            display: flex;
            align-items: center;
            overflow-y: auto;
        }

        .narrative-text {
            width: 100%;
            font-size: 12px;
            line-height: 1.44;
            color: var(--ink-dark);
            font-weight: 500;
            text-align: justify;
            text-align-last: left;
        }

        .narrative-pager {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding-top: 4px;
            flex-shrink: 0;
        }

        .mini-text-arrow {
            width: 26px;
            height: 22px;
            border: none;
            background: transparent;
            box-shadow: none;
            color: var(--ink-dark);
            font-size: 16px;
            font-weight: 800;
            line-height: 1;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.14s ease, opacity 0.14s ease;
        }

        .mini-text-arrow:active {
            transform: scale(0.88);
        }

        .mini-text-arrow:disabled {
            opacity: 0.28;
            cursor: default;
        }

        .narrative-page-indicator {
            font-size: 10.5px;
            font-weight: 700;
            color: var(--ink-dark);
            letter-spacing: 0.04em;
        }

        .intro-bottom-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4px 0 2px;
            flex-shrink: 0;
        }

        .enter-lesson-btn {
            position: relative;
            width: 100%;
            max-width: 260px;
            background-color: #fcd34d;
            background-image: url('frame.png');
            background-size: cover;
            background-position: center;
            border: 2px solid var(--ink-dark);
            border-radius: 12px;
            overflow: hidden;
            color: var(--ink-dark);
            padding: 11px 18px;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 2px 2px 0px var(--ink-dark);
            transition: transform 0.16s ease, box-shadow 0.16s ease;
        }

        .enter-lesson-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background-color: rgba(252, 211, 77, 0.78);
            pointer-events: none;
            z-index: 0;
        }

        .enter-lesson-btn span {
            position: relative;
            z-index: 1;
        }

        .enter-lesson-btn:active,
        .enter-lesson-btn.pressed {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px var(--ink-dark);
        }

        .btn-action::before {
            content: '';
            position: absolute;
            inset: 0;
            background-color: rgba(252, 211, 77, 0.72);
            pointer-events: none;
            z-index: 0;
        }

        .btn-action.saved-state::before {
            background-color: rgba(134, 239, 172, 0.78);
        }

        .btn-action span {
            position: relative;
            z-index: 1;
        }

        /* 2. SCAN WORKSPACE */
        .scan-workspace {
            width: 100%;
            height: fit-content;
            display: none;
            flex-direction: column;
            align-items: center;
        }

        .riddle-box {
            width: 100%;
            background-image: url('frame.png');
            background-size: cover;
            background-position: center;
            border: 2px solid var(--ink-dark);
            border-radius: 14px;
            overflow: hidden;
            padding: 12px 16px;
            text-align: center;
            margin-bottom: 12px;
            box-shadow: 2px 3px 0px var(--ink-dark);
        }

        .riddle-text {
            font-size: 14px;
            line-height: 1.35;
            font-weight: 700;
            color: var(--ink-dark);
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 100%;
            margin-bottom: 14px;
            opacity: 1;
        }

        .card-slot {
            perspective: 800px;
            height: 88px;
        }

        .mini-cube-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            -webkit-transform-style: preserve-3d;
            animation: mini-levitate 4s ease-in-out infinite;
            cursor: pointer;
        }

        @keyframes mini-levitate {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-3px); }
        }

        .mini-cube {
            width: 100%;
            height: 100%;
            position: absolute;
            transform-style: preserve-3d;
            -webkit-transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .card-slot.flipped .mini-cube {
            transform: rotateY(180deg);
        }

        .mini-face {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            background-image: url('frame.png');
            background-size: cover;
            background-position: center;
            border: 2px solid var(--ink-dark);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 10px;
            text-align: center;
            box-shadow: 2px 3px 0px var(--ink-dark);
        }

        .mini-face-back {
            transform: rotateY(180deg);
        }

        .card-emoji { font-size: 22px; margin-bottom: 2px; }
        .card-title { font-size: 12px; font-weight: 700; color: var(--ink-dark); }

        .card-slot.wrong .mini-face-back span {
            color: var(--wrong-text);
            font-weight: 800;
            font-size: 10.5px;
            line-height: 1.25;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .card-slot:not(.wrong) .mini-face-back span {
            font-size: 11px;
            line-height: 1.3;
            font-weight: 600;
            color: var(--ink-dark);
            text-align: center;
        }

        .card-slot.correct .mini-face-back div {
            color: var(--correct-text);
        }

        .action-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 100%;
            opacity: 1;
            visibility: hidden;
            transform: translateX(-120vw);
            pointer-events: none;
            transition: transform 0.65s cubic-bezier(0.16, 1, 0.3, 1), visibility 0s linear 0.65s;
            will-change: transform;
        }

        .action-row.visible {
            visibility: visible;
            transform: translateX(0);
            pointer-events: auto;
            transition: transform 0.65s cubic-bezier(0.16, 1, 0.3, 1), visibility 0s linear 0s;
        }

        .btn-action {
            position: relative;
            background-image: url('frame.png');
            background-size: cover;
            background-position: center;
            border: 2px solid var(--ink-dark);
            border-radius: 14px;
            overflow: hidden;
            color: var(--ink-dark);
            padding: 12px 10px;
            font-size: 11.5px;
            font-weight: 800;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            cursor: pointer;
            width: 100%;
            box-shadow: 2px 3px 0px var(--ink-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .btn-action:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px var(--ink-dark);
        }

        /* 3. MEMORY STORAGE CENTERED 2x2 WITH HORIZONTAL SCROLL */
        .memory-vault {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.72s cubic-bezier(0.16, 1, 0.3, 1), filter 0.45s ease;
        }

        .memory-vault.defocused {
            filter: blur(5px) brightness(0.84);
            pointer-events: none;
        }

        .vault-scroll {
            position: relative;
            width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .vault-scroll.has-overflow {
            justify-content: flex-start;
        }

        .vault-scroll::-webkit-scrollbar {
            display: none;
        }

        .vault-grid {
            display: grid;
            grid-template-rows: repeat(2, 122px);
            grid-auto-flow: column;
            grid-auto-columns: 122px;
            row-gap: 10px;
            column-gap: 12px;
            width: max-content;
            align-items: center;
            justify-items: center;
            padding: 4px;
        }

        .vault-node-slot {
            width: 122px;
            height: 122px;
            cursor: pointer;
            animation: node-levitate 4.4s ease-in-out infinite;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .vault-node-slot.picked-out {
            visibility: hidden;
            pointer-events: none;
        }

        @keyframes node-levitate {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-4px); }
        }

        .vault-mini-canvas {
            width: 122px;
            height: 122px;
            display: block;
        }

        /* Shared pink action button placed cleanly in flow below cubes */
        .bottom-nav-btn {
            position: relative;
            margin-top: 26px;
            background-color: #d9779a;
            background-image: url('frame.png');
            background-size: cover;
            background-position: center;
            border: 2px solid var(--ink-dark);
            border-radius: 12px;
            overflow: hidden;
            color: var(--ink-dark);
            padding: 10px 20px;
            font-size: 11.5px;
            font-weight: 800;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 2px 2px 0px var(--ink-dark);
            z-index: 30;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .bottom-nav-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background-color: rgba(236, 122, 162, 0.72);
            pointer-events: none;
            z-index: 0;
        }

        .bottom-nav-btn span {
            position: relative;
            z-index: 1;
        }

        .bottom-nav-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px var(--ink-dark);
        }

        /* 4. THREE.JS WEBGL 3D CUBE STAGE (CENTERED FULL VIEWPORT OVERLAY) */
        .cube-stage {
            display: none;
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100dvh;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
            z-index: 40;
            padding: 16px;
        }

        .webgl-cube-holder {
            position: relative;
            width: 264px;
            height: 264px;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: scale(0.88);
            transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .webgl-cube-holder.approached {
            transform: scale(1);
        }

        #threeCanvasHost {
            width: 264px;
            height: 264px;
            position: relative;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #threeCanvasHost canvas {
            display: block;
            width: 264px !important;
            height: 264px !important;
        }

        .touch-overlay {
            position: absolute;
            inset: 8px;
            z-index: 20;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
        }

        .zone {
            cursor: pointer;
            background: transparent;
            border: none;
        }
    </style>
</head>
<body>

    <div class="retro-board" id="retroBoard">
        <!-- Background Layers -->
        <div class="bg-layer bg-first-page"></div>
        <div class="bg-layer bg-clouds-page"></div>
        <div class="bg-layer bg-vault-page"></div>

        <div class="content-wrap">

            <!-- Screen 1: Intro Narrative -->
            <div class="intro-screen page-slide active-center" id="introScreen">
                <div class="intro-frame-box">
                    <img src="Alan%20and%20the%20apple.jpg" alt="Alan in the orchard" class="intro-illustration">
                </div>

                <div class="narrative-box">
                    <div class="narrative-body">
                        <p class="narrative-text" id="narrativeText">
                            Alan wandered into an orchard and saw various fruits lying on the ground. While looking around, something suddenly fell on his head. It was red and firm. And it was...
                        </p>
                    </div>
                    <div class="narrative-pager">
                        <button class="mini-text-arrow" id="textPrevBtn" onclick="cycleNarrativeText(-1)" aria-label="Previous text"><span>‹</span></button>
                        <span class="narrative-page-indicator" id="narrativePageIndicator">1 / 2</span>
                        <button class="mini-text-arrow" id="textNextBtn" onclick="cycleNarrativeText(1)" aria-label="Next text"><span>›</span></button>
                    </div>
                </div>

                <div class="intro-bottom-group">
                    <button class="enter-lesson-btn" id="enterLessonBtn" onclick="startScan(this)"><span>Start Exercise</span></button>
                </div>
            </div>

            <!-- Screen 2: Hand-Drawn Mini-Cube Quiz Choices -->
            <div class="scan-workspace page-slide" id="scanWorkspace">
                <div class="riddle-box">
                    <div class="riddle-text">The fruit that fell on Alan’s head</div>
                </div>

                <div class="cards-grid" id="cardsGrid">
                    <!-- Card 0: Plum -->
                    <div class="card-slot" id="card0" data-correct="false">
                        <div class="mini-cube-wrapper" onclick="handleCardTap(this.parentElement)">
                            <div class="mini-cube">
                                <div class="mini-face">
                                    <div class="card-emoji">🍑</div>
                                    <div class="card-title">Plum</div>
                                </div>
                                <div class="mini-face mini-face-back">
                                    <span>Scan error</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Card 1: Orange -->
                    <div class="card-slot" id="card1" data-correct="false">
                        <div class="mini-cube-wrapper" onclick="handleCardTap(this.parentElement)">
                            <div class="mini-cube">
                                <div class="mini-face">
                                    <div class="card-emoji">🍊</div>
                                    <div class="card-title">Orange</div>
                                </div>
                                <div class="mini-face mini-face-back">
                                    <span>Scan error</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Card 2: Pear -->
                    <div class="card-slot" id="card2" data-correct="false">
                        <div class="mini-cube-wrapper" onclick="handleCardTap(this.parentElement)">
                            <div class="mini-cube">
                                <div class="mini-face">
                                    <div class="card-emoji">🍐</div>
                                    <div class="card-title">Pear</div>
                                </div>
                                <div class="mini-face mini-face-back">
                                    <span>Scan error</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Card 3: Apple -->
                    <div class="card-slot" id="card3" data-correct="true">
                        <div class="mini-cube-wrapper" onclick="handleCardTap(this.parentElement)">
                            <div class="mini-cube">
                                <div class="mini-face">
                                    <div class="card-emoji">🍎</div>
                                    <div class="card-title">Apple</div>
                                </div>
                                <div class="mini-face mini-face-back">
                                    <div style="font-weight: 800; font-size: 13px; letter-spacing: 0.05em;">APPLE</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="action-row" id="actionRow">
                    <button class="btn-action" id="saveCubeBtn" onclick="saveInCube()"><span>Save in Cube</span></button>
                    <button class="btn-action" id="goCubeBtn" onclick="openMemoryVault()"><span>Go to Cube</span></button>
                </div>
            </div>

            <!-- Screen 3: Memory Storage Centered 2x2 with Horizontal Scroll -->
            <div class="memory-vault page-slide" id="memoryVault">
                <div class="vault-scroll" id="vaultScroll">
                    <div class="vault-grid" id="vaultGrid"></div>
                </div>
                <button class="bottom-nav-btn" id="backToAdventuresBtn" onclick="returnToAdventures()"><span>Back to Adventures</span></button>
            </div>

        </div>

        <!-- Screen 4: Three.js WebGL 3D Cube Inspection (Centered Overlay) -->
        <div class="cube-stage" id="cubeStage">
            <div class="webgl-cube-holder" id="cubeDepthHolder">
                <div id="threeCanvasHost"></div>
                <div class="touch-overlay">
                    <div class="zone" onclick="tiltUp()"></div>
                    <div class="zone" onclick="tiltUp()"></div>
                    <div class="zone" onclick="tiltUp()"></div>

                    <div class="zone" onclick="turnLeft()"></div>
                    <div class="zone" onclick="turnBack()"></div>
                    <div class="zone" onclick="turnRight()"></div>

                    <div class="zone" onclick="tiltDown()"></div>
                    <div class="zone" onclick="tiltDown()"></div>
                    <div class="zone" onclick="tiltDown()"></div>
                </div>
            </div>

            <button class="bottom-nav-btn" id="backToGridBtn" onclick="returnToVault()"><span>← Back to Grid</span></button>
        </div>
    </div>

    <script>
        let isSolved = false;
        let isAppleSaved = false;
        let vaultSpinRaf = null;
        let activePickedSlot = null;
        let vaultMiniCubes = [];
        let narrativeIndex = 0;
        let stoneSourceImage = null;

        const INTRO_NARRATIVE_PAGES = [
            "Alan wandered into an orchard and saw various fruits lying on the ground. While looking around, something suddenly fell on his head. It was red and firm. And it was...",
            "He picked it up and turned it over in his purple hands. Every new object in this strange world holds a word worth remembering before the next step."
        ];

        // Main Three.js inspection cube state
        let scene, camera, renderer, stoneCubeMesh;
        let targetRotX = 0;
        let targetRotY = 0;
        let currentRotX = 0;
        let currentRotY = 0;
        let threeAnimId = null;

        const CUBE_OFFSETS = [
            { x: -1, y: 1 },  { x: 1, y: -1 },
            { x: 1, y: 1 },   { x: -1, y: -1 }
        ];

        const DEFAULT_WORDS = [
            {
                id: 'orchard',
                word: 'ORCHARD',
                phonetic: '/ˈɔː.tʃəd/',
                definition: 'A piece of land planted with fruit trees',

                ex2: 'The apple trees in the orchard were full of fruit.',
                ex3: 'Autumn is the best season to visit an orchard.',
                visual: '🌳'
            },
            {
                id: 'firm',
                word: 'FIRM',
                phonetic: '/fɜːm/',
                definition: 'Hard and solid when pressed, not soft',
                ex1: 'The red fruit felt smooth and firm.',
                ex2: 'She picked a firm apple from the basket.',
                ex3: 'This mattress is comfortable and firm.',
                visual: '🧱'
            },
            {
                id: 'ground',
                word: 'GROUND',
                phonetic: '/ɡraʊnd/',
                definition: 'The solid surface of the earth',
                ex1: 'Various fruits were lying on the ground.',
                ex2: 'The ripe apple fell softly onto the ground.',

        const APPLE_WORD = {
            id: 'apple',
            word: 'APPLE',
            phonetic: '/ˈæp.əl/',
            definition: 'The fruit that fell on Alan’s head',
            ex1: 'I eat a fresh apple every morning.',

            ex3: 'This green apple tastes quite sour.',

        function loadStoneSourceImage() {
            return new Promise((resolve) => {
                if (stoneSourceImage) {
                    resolve(stoneSourceImage);
                    return;
                }
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => {
                    stoneSourceImage = img;
                    resolve(img);
                };
                img.onerror = () => {
                    resolve(null);
                };
                img.src = 'Cube1.webp';
            });
        }

        function refreshVaultTexturesFromImage() {
            if (!stoneSourceImage || vaultMiniCubes.length === 0) return;
            const maxAniso = renderer ? renderer.capabilities.getMaxAnisotropy() : 8;
            vaultMiniCubes.forEach((entry, idx) => {
                const set = createMultiStoneTextures([entry.wordText], { isMiniWord: true }, idx + 1, maxAniso);
                entry.mesh.material.forEach((mat) => {
                    mat.map = set.map;
                    mat.bumpMap = set.bumpMap;
                    mat.needsUpdate = true;
                });
                entry.renderer.render(entry.scene, entry.camera);
            });
        }

        function updateNarrativeView() {
            const textEl = document.getElementById('narrativeText');
            const indicatorEl = document.getElementById('narrativePageIndicator');
            const prevBtn = document.getElementById('textPrevBtn');
            const nextBtn = document.getElementById('textNextBtn');

            if (textEl) textEl.textContent = INTRO_NARRATIVE_PAGES[narrativeIndex];
            if (indicatorEl) indicatorEl.textContent = `${narrativeIndex + 1} / ${INTRO_NARRATIVE_PAGES.length}`;
            if (prevBtn) prevBtn.disabled = narrativeIndex === 0;
            if (nextBtn) nextBtn.disabled = narrativeIndex === INTRO_NARRATIVE_PAGES.length - 1;
        }

        function cycleNarrativeText(delta) {
            const nextIdx = narrativeIndex + delta;
            if (nextIdx < 0 || nextIdx >= INTRO_NARRATIVE_PAGES.length) return;
            narrativeIndex = nextIdx;
            updateNarrativeView();
        }

        function getStoredWords() {
            try {
                const raw = localStorage.getItem('alien_memory_cubes_v19');
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed) && parsed.length > 0) return parsed;
                }
            } catch (e) {}
            return [...DEFAULT_WORDS];
        }

        function saveStoredWords(words) {
            try {
                localStorage.setItem('alien_memory_cubes_v19', JSON.stringify(words));
            } catch (e) {}
        }

        function slideBetweenPages(fromEl, toEl, onAfterShow) {
            fromEl.classList.remove('active-center');
            fromEl.classList.add('exit-to-left');

            toEl.style.display = 'flex';
            toEl.classList.remove('exit-to-left', 'active-center');
            toEl.classList.add('enter-from-right');
            toEl.offsetHeight;

            requestAnimationFrame(() => {
                toEl.classList.remove('enter-from-right');
                toEl.classList.add('active-center');
            });

            if (typeof onAfterShow === 'function') {
                onAfterShow();
            }

            setTimeout(() => {
                fromEl.style.display = 'none';
                fromEl.classList.remove('exit-to-left');
            }, 720);
        }

        function startScan(btn) {
            const intro = document.getElementById('introScreen');
            const workspace = document.getElementById('scanWorkspace');
            const board = document.getElementById('retroBoard');

            if (btn) btn.classList.add('pressed');

            setTimeout(() => {
                if (btn) btn.classList.remove('pressed');
                board.classList.remove('vault-bg');
                board.classList.add('clouds-bg');
                slideBetweenPages(intro, workspace);
            }, 160);
        }

        function handleCardTap(slot) {
            if (isSolved) return;

            const slotEl = slot.closest('.card-slot');
            const isCorrect = slotEl.dataset.correct === 'true';

            if (isCorrect) {
                isSolved = true;
                slotEl.classList.add('correct', 'flipped');

                const otherExamples = [
                    "I eat a fresh apple every morning.",
                    "She cut the apple into four equal pieces.",
                    "This green apple tastes quite sour."
                ];

                let exIdx = 0;
                document.querySelectorAll('.card-slot').forEach((otherSlot) => {
                    if (otherSlot !== slotEl) {
                        otherSlot.classList.remove('wrong');
                        otherSlot.querySelector('.mini-face-back span').textContent = otherExamples[exIdx++];
                        otherSlot.classList.add('flipped');
                    }
                });

                const actionRow = document.getElementById('actionRow');
                actionRow.classList.remove('visible');
                actionRow.offsetHeight;
                requestAnimationFrame(() => {
                    actionRow.classList.add('visible');
                });
            } else {
                const willFlip = !slotEl.classList.contains('flipped');
                slotEl.classList.toggle('flipped', willFlip);
                slotEl.classList.toggle('wrong', willFlip);
            }
        }

        function saveInCube() {
            if (isAppleSaved) return;
            isAppleSaved = true;

            const words = getStoredWords();
            if (!words.some(w => w.id === 'apple')) {
                words.unshift(APPLE_WORD);
                saveStoredWords(words);
            }

            const btn = document.getElementById('saveCubeBtn');
            btn.classList.add('saved-state');
            btn.querySelector('span').textContent = 'Saved ✓';
        }

        function openMemoryVault() {
            const workspace = document.getElementById('scanWorkspace');
            const vault = document.getElementById('memoryVault');
            const board = document.getElementById('retroBoard');

            const words = getStoredWords();
            if (!words.some(w => w.id === 'apple')) {
                words.unshift(APPLE_WORD);
                saveStoredWords(words);
            }

            renderVaultGrid(words);
            loadStoneSourceImage().then((img) => {
                if (img) refreshVaultTexturesFromImage();
            });

            board.classList.remove('clouds-bg', 'blurred-bg');
            board.classList.add('vault-bg');
            vault.classList.remove('defocused');

            slideBetweenPages(workspace, vault, () => {
                startVaultSpinning();
            });
        }

        function returnToAdventures() {
            const vault = document.getElementById('memoryVault');
            const workspace = document.getElementById('scanWorkspace');
            const board = document.getElementById('retroBoard');

            if (vaultSpinRaf) {
                cancelAnimationFrame(vaultSpinRaf);
                vaultSpinRaf = null;
            }

            board.classList.remove('vault-bg', 'blurred-bg');
            board.classList.add('clouds-bg');

            vault.classList.remove('active-center');
            vault.classList.add('exit-to-left');

            workspace.style.display = 'flex';
            workspace.classList.remove('exit-to-left', 'active-center');
            workspace.classList.add('enter-from-right');
            workspace.offsetHeight;

            requestAnimationFrame(() => {
                workspace.classList.remove('enter-from-right');
                workspace.classList.add('active-center');
            });

            setTimeout(() => {
                vault.style.display = 'none';
                vault.classList.remove('exit-to-left');
            }, 720);
        }

        function createSharperStoneCubeGeometry(size, rounding = 0.11) {
            const segs = 12;
            const geom = new THREE.BoxGeometry(size, size, size, segs, segs, segs);
            const pos = geom.attributes.position;
            const half = size * 0.5;
            const r = Math.min(half * 0.9, size * rounding);
            const inner = Math.max(0.001, half - r);

            for (let i = 0; i < pos.count; i++) {
                let x = pos.getX(i);
                let y = pos.getY(i);
                let z = pos.getZ(i);

                const cx = Math.max(-inner, Math.min(inner, x));
                const cy = Math.max(-inner, Math.min(inner, y));
                const cz = Math.max(-inner, Math.min(inner, z));

                const dx = x - cx;
                const dy = y - cy;
                const dz = z - cz;
                const len = Math.hypot(dx, dy, dz);

                if (len > 0.00001) {
                    const targetLen = Math.min(r, len * 1.12);
                    x = cx + (dx / len) * targetLen;
                    y = cy + (dy / len) * targetLen;
                    z = cz + (dz / len) * targetLen;
                }

                pos.setXYZ(i, x, y, z);
            }

            geom.computeVertexNormals();
            return geom;
        }

        function seededRand(seed) {
            const x = Math.sin(seed * 12.9898 + 78.233) * 43758.5453;
            return x - Math.floor(x);
        }

        function drawCube1StoneBase(ctx, bctx, size, seedOffset) {
            ctx.fillStyle = '#c4c7ce';
            ctx.fillRect(0, 0, size, size);

            bctx.fillStyle = '#808080';
            bctx.fillRect(0, 0, size, size);

            if (stoneSourceImage && stoneSourceImage.width > 0 && stoneSourceImage.height > 0) {
                const iw = stoneSourceImage.width;
                const ih = stoneSourceImage.height;

                // Sample from the left or right angled face of Cube1.webp at high fidelity
                const useRightFacet = (seedOffset % 2) === 1;
                const sx = useRightFacet ? Math.floor(iw * 0.50) : Math.floor(iw * 0.18);
                const sy = Math.floor(ih * 0.32);
                const sw = Math.floor(iw * 0.30);
                const sh = Math.floor(ih * 0.36);

                const tmpCanvas = document.createElement('canvas');
                tmpCanvas.width = size;
                tmpCanvas.height = size;
                const tctx = tmpCanvas.getContext('2d');
                tctx.imageSmoothingEnabled = true;
                tctx.imageSmoothingQuality = 'high';

                tctx.save();
                tctx.translate(size / 2, size / 2);
                const rotDeg = ((seedOffset * 37) % 4) * 90;
                tctx.rotate(THREE.MathUtils.degToRad(rotDeg));
                if (seedOffset % 3 === 0) {
                    tctx.scale(-1, 1);
                }
                const shearAngle = useRightFacet ? -0.14 : 0.14;
                tctx.transform(1, shearAngle, 0, 1, 0, 0);
                tctx.drawImage(stoneSourceImage, sx, sy, sw, sh, -size * 0.56, -size * 0.56, size * 1.12, size * 1.12);
                tctx.restore();

                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                ctx.drawImage(tmpCanvas, 0, 0, size, size);

                // Derive crisp bump map from luminance
                const imgData = ctx.getImageData(0, 0, size, size);
                const bData = bctx.getImageData(0, 0, size, size);
                const d = imgData.data;
                const bd = bData.data;
                for (let i = 0; i < d.length; i += 4) {
                    const lum = (d[i] * 0.3 + d[i + 1] * 0.59 + d[i + 2] * 0.11);
                    const h = Math.max(15, Math.min(240, Math.round(128 + (lum - 170) * 1.05)));
                    bd[i] = h;
                    bd[i + 1] = h;
                    bd[i + 2] = h;
                    bd[i + 3] = 255;
                }
                bctx.putImageData(bData, 0, 0);
            }

            // Crisp graphic border matching Cube1.webp illustrated outline
            ctx.save();
            ctx.strokeStyle = 'rgba(24, 24, 27, 0.42)';
            ctx.lineWidth = Math.max(8, Math.round(size * 0.014));
            ctx.strokeRect(4, 4, size - 8, size - 8);
            ctx.restore();
        }

        function createMultiStoneTextures(lines, options = {}, seedOffset = 1, maxAniso = 8) {
            const size = 1024;
            const colorCanvas = document.createElement('canvas');
            colorCanvas.width = size;
            colorCanvas.height = size;
            const ctx = colorCanvas.getContext('2d');

            const bumpCanvas = document.createElement('canvas');
            bumpCanvas.width = size;
            bumpCanvas.height = size;
            const bctx = bumpCanvas.getContext('2d');

            drawCube1StoneBase(ctx, bctx, size, seedOffset);

            ctx.fillStyle = '#141417';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            if (options.isEmoji) {
                ctx.font = '272px sans-serif';
                ctx.fillText(lines[0], size / 2, size / 2 + 8);
            } else if (options.isMiniWord) {
                const word = lines[0];
                const fontSize = word.length > 6 ? 108 : 132;
                ctx.font = `900 ${fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
                ctx.fillText(word, size / 2, size / 2 + 4);
            } else if (options.isTitle) {
                ctx.font = '900 144px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
                ctx.fillText(lines[0], size / 2, size / 2 - 42);
                if (lines[1]) {
                    ctx.font = '700 66px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
                    ctx.fillStyle = '#1f1f24';
                    ctx.fillText(lines[1], size / 2, size / 2 + 86);
                }
            } else {
                const fontSize = (options.fontSize || 36) * 2;
                ctx.font = `700 ${fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
                const text = lines.join(' ');
                const words = text.split(' ');
                const wrapped = [];
                let currentLine = '';

                words.forEach((w) => {
                    const testLine = currentLine ? currentLine + ' ' + w : w;
                    if (ctx.measureText(testLine).width > size - 176 && currentLine) {
                        wrapped.push(currentLine);
                        currentLine = w;
                    } else {
                        currentLine = testLine;
                    }
                });
                if (currentLine) wrapped.push(currentLine);

                const lineHeight = fontSize * 1.3;
                const startY = size / 2 - ((wrapped.length - 1) * lineHeight) / 2;
                wrapped.forEach((line, idx) => {
                    ctx.fillText(line, size / 2, startY + idx * lineHeight);
                });
            }

            const map = new THREE.CanvasTexture(colorCanvas);
            map.anisotropy = maxAniso;

            const bumpMap = new THREE.CanvasTexture(bumpCanvas);
            bumpMap.anisotropy = maxAniso;

            return { map, bumpMap };
        }

        function disposeVaultMiniCubes() {
            vaultMiniCubes.forEach((entry) => {
                if (entry.renderer) {
                    entry.renderer.dispose();
                }
            });
            vaultMiniCubes = [];
        }

        function renderVaultGrid(words) {
            const grid = document.getElementById('vaultGrid');
            const scrollEl = document.getElementById('vaultScroll');
            disposeVaultMiniCubes();
            grid.innerHTML = '';

            const visibleWords = words.slice(0, 4);

            visibleWords.forEach((item, index) => {
                const offset = CUBE_OFFSETS[index % CUBE_OFFSETS.length];
                const slot = document.createElement('div');
                slot.className = 'vault-node-slot';
                slot.style.marginLeft = offset.x + 'px';
                slot.style.marginTop = offset.y + 'px';
                slot.style.animationDelay = ((index * 0.45) % 3.2) + 's';

                const canvas = document.createElement('canvas');
                canvas.className = 'vault-mini-canvas';
                canvas.width = 244;
                canvas.height = 244;
                slot.appendChild(canvas);

                slot.onclick = () => inspectMemoryCube(item, slot);
                grid.appendChild(slot);

                if (typeof THREE !== 'undefined') {
                    const miniScene = new THREE.Scene();
                    const miniCam = new THREE.PerspectiveCamera(36, 1, 0.1, 50);
                    miniCam.position.set(0, 0, 5.15);
                    miniCam.lookAt(0, 0, 0);

                    const miniRenderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
                    miniRenderer.setSize(122, 122);
                    miniRenderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 3));
                    const maxAniso = miniRenderer.capabilities.getMaxAnisotropy();

                    miniScene.add(new THREE.AmbientLight(0xe4e7f0, 0.92));
                    const dLight = new THREE.DirectionalLight(0xf4f4f6, 0.55);
                    dLight.position.set(2, 2.5, 4);
                    miniScene.add(dLight);

                    const geom = createSharperStoneCubeGeometry(2.02, 0.11);
                    const stoneSet = createMultiStoneTextures([item.word], { isMiniWord: true }, index + 1, maxAniso);
                    const mats = Array.from({ length: 6 }, () => new THREE.MeshStandardMaterial({
                        map: stoneSet.map,
                        bumpMap: stoneSet.bumpMap,
                        bumpScale: 0.03,
                        roughness: 0.86,
                        metalness: 0.03
                    }));

                    const mesh = new THREE.Mesh(geom, mats);
                    mesh.rotation.x = 0;
                    mesh.rotation.y = THREE.MathUtils.degToRad(index * 25);
                    miniScene.add(mesh);

                    miniRenderer.render(miniScene, miniCam);

                    vaultMiniCubes.push({
                        scene: miniScene,
                        camera: miniCam,
                        renderer: miniRenderer,
                        mesh,
                        wordText: item.word,
                        angle: index * 25
                    });
                }
            });

            scrollEl.classList.toggle('has-overflow', grid.scrollWidth > scrollEl.clientWidth);
        }

        function startVaultSpinning() {
            if (vaultSpinRaf) cancelAnimationFrame(vaultSpinRaf);
            let lastTime = performance.now();

            function step(now) {
                const delta = now - lastTime;
                lastTime = now;

                vaultMiniCubes.forEach((entry) => {
                    entry.angle = (entry.angle + delta * 0.0105) % 360;
                    entry.mesh.rotation.x = 0;
                    entry.mesh.rotation.y = THREE.MathUtils.degToRad(entry.angle);
                    entry.renderer.render(entry.scene, entry.camera);
                });

                vaultSpinRaf = requestAnimationFrame(step);
            }

            vaultSpinRaf = requestAnimationFrame(step);
        }

        function buildInspectionCubeMesh(wordData) {
            if (stoneCubeMesh) {
                scene.remove(stoneCubeMesh);
            }

            const geom = createSharperStoneCubeGeometry(2.04, 0.10);
            const maxAniso = renderer ? renderer.capabilities.getMaxAnisotropy() : 8;

            const faceSets = [
                createMultiStoneTextures([wordData.ex1], { fontSize: 36 }, 11, maxAniso),
                createMultiStoneTextures([wordData.ex2], { fontSize: 36 }, 12, maxAniso),
                createMultiStoneTextures([wordData.definition], { fontSize: 36 }, 13, maxAniso),
                createMultiStoneTextures([wordData.visual], { isEmoji: true }, 14, maxAniso),
                createMultiStoneTextures([wordData.word, wordData.phonetic], { isTitle: true }, 15, maxAniso),
                createMultiStoneTextures([wordData.ex3], { fontSize: 36 }, 16, maxAniso)
            ];

            const materials = faceSets.map((set) => new THREE.MeshStandardMaterial({
                map: set.map,
                bumpMap: set.bumpMap,
                bumpScale: 0.03,
                roughness: 0.86,
                metalness: 0.03
            }));

            stoneCubeMesh = new THREE.Mesh(geom, materials);
            scene.add(stoneCubeMesh);

            targetRotX = 0;
            targetRotY = 0;
            currentRotX = 0;
            currentRotY = 0;
            stoneCubeMesh.rotation.set(0, 0, 0);
        }

        function initThreeCube(wordData) {
            const host = document.getElementById('threeCanvasHost');
            if (!host || typeof THREE === 'undefined') return;

            if (!renderer) {
                scene = new THREE.Scene();
                camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
                camera.position.set(0, 0, 5.5);
                camera.lookAt(0, 0, 0);

                renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setSize(264, 264);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 3));
                host.innerHTML = '';
                host.appendChild(renderer.domElement);

                const ambient = new THREE.AmbientLight(0xe4e7f0, 0.92);
                scene.add(ambient);

                const keyLight = new THREE.DirectionalLight(0xf4f4f6, 0.55);
                keyLight.position.set(2, 2.5, 4);
                scene.add(keyLight);

                const rimLight = new THREE.DirectionalLight(0xa5b4fc, 0.14);
                rimLight.position.set(-2.5, -1.5, -2);
                scene.add(rimLight);
            }

            buildInspectionCubeMesh(wordData);

            loadStoneSourceImage().then((img) => {
                if (img && stoneCubeMesh) {
                    buildInspectionCubeMesh(wordData);
                }
            });

            if (!threeAnimId) {
                renderThreeLoop();
            }
        }

        function renderThreeLoop() {
            threeAnimId = requestAnimationFrame(renderThreeLoop);
            if (!renderer || !scene || !camera) return;

            currentRotX += (targetRotX - currentRotX) * 0.14;
            currentRotY += (targetRotY - currentRotY) * 0.14;

            if (stoneCubeMesh) {
                stoneCubeMesh.rotation.x = THREE.MathUtils.degToRad(currentRotX);
                stoneCubeMesh.rotation.y = THREE.MathUtils.degToRad(currentRotY);
                stoneCubeMesh.position.y = Math.sin(performance.now() * 0.0022) * 0.035;
            }

            renderer.render(scene, camera);
        }

        function inspectMemoryCube(wordData, sourceSlot) {
            const vault = document.getElementById('memoryVault');
            const cubeStage = document.getElementById('cubeStage');
            const holder = document.getElementById('cubeDepthHolder');
            const board = document.getElementById('retroBoard');

            if (activePickedSlot) {
                activePickedSlot.classList.remove('picked-out');
            }
            activePickedSlot = sourceSlot || null;
            if (sourceSlot) {
                sourceSlot.classList.add('picked-out');
            }

            initThreeCube(wordData);

            vault.classList.add('defocused');
            board.classList.add('blurred-bg');

            holder.classList.remove('approached');
            cubeStage.style.display = 'flex';
            holder.offsetHeight;

            requestAnimationFrame(() => {
                holder.classList.add('approached');
            });
        }

        function returnToVault() {
            const vault = document.getElementById('memoryVault');
            const cubeStage = document.getElementById('cubeStage');
            const holder = document.getElementById('cubeDepthHolder');
            const board = document.getElementById('retroBoard');

            if (activePickedSlot) {
                activePickedSlot.classList.remove('picked-out');
                activePickedSlot = null;
            }

            holder.classList.remove('approached');
            board.classList.remove('blurred-bg');
            vault.classList.remove('defocused');
            cubeStage.style.display = 'none';
        }

        function alignYToUprightFront() {
            targetRotY = Math.round(targetRotY / 360) * 360;
        }

        function tiltUp() {
            alignYToUprightFront();
            targetRotX = targetRotX > 0 ? 0 : -90;
        }

        function tiltDown() {
            alignYToUprightFront();
            targetRotX = targetRotX < 0 ? 0 : 90;
        }

        function turnLeft() {
            targetRotX = 0;
            targetRotY += 90;
        }

        function turnRight() {
            targetRotX = 0;
            targetRotY -= 90;
        }

        function turnBack() {
            targetRotX = 0;
            targetRotY += 180;
        }

        loadStoneSourceImage();
        updateNarrativeView();
    </script>
